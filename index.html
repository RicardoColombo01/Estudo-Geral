      <div><p class="c-name">A fazer</p><p class="c-sub">${pend?`${pend} item${pend===1?"":"s"} pendente${pend===1?"":"s"}`:"Tudo concluído 🎉"}</p></div>
    </button>
    <button class="card feature" data-go="resumo">
      <div class="c-top"><span class="c-emoji">📊</span></div>
      <div><p class="c-name">Visão geral</p><p class="c-sub">Progresso, pendentes e cronograma</p></div>
    </button>
    <button class="card feature" data-go="mural">
      <div class="c-top"><span class="c-emoji">💬</span></div>
      <div><p class="c-name">Mural</p><p class="c-sub">Recados compartilhados com todos</p></div>
    </button>`;

  if(temMateriais){
    const nm = todosMateriais().length;
    cards += `
    <button class="card feature" data-go="materiais">
      <div class="c-top"><span class="c-emoji">📎</span>${nm?`<span class="badge">${nm}</span>`:""}</div>
      <div><p class="c-name">Materiais</p><p class="c-sub">${nm?"Cursos, vídeos e artigos que você guardou":"Guarde links de estudo por tema"}</p></div>
    </button>`;
  }

  /* Só para quem está logado: sem conta não há data guardada, e um histórico
     sem "quando" não é histórico. */
  if(logado() && !modoModelo){
    cards += `
    <button class="card feature" data-go="historico">
      <div class="c-top"><span class="c-emoji">📜</span>${ov.d?`<span class="badge">${ov.d}</span>`:""}</div>
      <div><p class="c-name">Histórico</p><p class="c-sub">${ov.d?"Tudo que você já concluiu, guardado":"O que você concluir fica guardado aqui"}</p></div>
    </button>`;
  }

  if(podeProjetos()){
    /* `projetos` só é carregado na rota #projetos, então o badge aparece a
       partir da primeira visita — igual ao de #revisar, que depende do
       carregarCartoes(). Sem badge o card continua correto. */
    const np = projetos.filter(p=>!p.arquivado_em).length;
    cards += `
    <button class="card feature" data-go="projetos">
      <div class="c-top"><span class="c-emoji">📁</span>${np?`<span class="badge">${np}</span>`:""}</div>
      <div><p class="c-name">Projetos</p><p class="c-sub">${np?`${np} projeto${np===1?"":"s"} em andamento`:"Um quadro de tarefas por projeto"}</p></div>
    </button>`;
  }

  if(podeUsarIA()){
    const nc = cartoes.length;
    cards += `
    <button class="card feature" data-go="revisar">
      <div class="c-top"><span class="c-emoji">🔁</span>${nc?`<span class="badge">${nc}</span>`:""}</div>
      <div><p class="c-name">Revisar</p><p class="c-sub">${nc?`${nc} cartão${nc===1?"":"ões"} para hoje`:"Cartões de revisão das suas anotações"}</p></div>
    </button>`;
  }

  let stages = state.abas.map((a,idx)=>{
    const s = stats(a); const full = s.t && s.d===s.t;
    return `<button class="card ${full?'done-all':''}" data-go="${a.id}">
      <div class="c-top"><span class="c-num mono">${String(idx+1).padStart(2,"0")}</span><span class="c-emoji">${a.emoji}</span></div>
      <p class="c-name">${esc(a.nome)}</p>
      <p class="c-sub">${esc(a.resumo)}</p>
      <div class="c-bar"><i style="width:${s.pct}%"></i></div>
      <div class="c-meta"><span class="c-count mono">${s.d}/${s.t} • ${s.pct}%</span><span class="c-go">→</span></div>
    </button>`;
  }).join("") + (podeEditar() ? `
    <button class="card novo" data-action="tema-novo">
      <div class="c-top"><span class="c-emoji">＋</span></div>
      <p class="c-name">Novo tema</p>
      <p class="c-sub">Adicionar um estágio à trilha</p>
    </button>` : "");

  return `<div class="wrap">
    <div class="bar"><span class="brandmini">📚 Trilha de Estudos</span><span class="spacer"></span>${contaBtn()}${themeBtn()}</div>

    <div class="home-head">
      <div class="eyebrow">${modoModelo?"modelo oficial":logado()?"sua trilha":"trilha oficial"}</div>
      <h1>IA &amp; Desenvolvimento</h1>
      <p>${modoModelo
        ? "Você está editando o modelo que todo mundo recebe ao criar conta. Ninguém perde o que já tem: para quem já tem conta, isto vira uma novidade a aceitar."
        : logado()
        ? "Esta trilha é sua: edite à vontade que ninguém mais vê suas mudanças. O progresso acompanha você em qualquer aparelho."
        : "Escolha por onde começar. Você está vendo a trilha oficial — entre para ganhar uma cópia sua, editável."}</p>
    </div>

    ${podeEditar()?"":convite("Entre com o Google para receber a sua própria cópia desta trilha, editar os temas do seu jeito e ter o progresso salvo na conta — do celular ao computador.")}

    <div class="overall-card">
      <div class="big-ring" style="--v:${ov.pct}"><span><b class="mono">${ov.pct}%</b><small>concluído</small></span></div>
      <div class="overall-txt">
        <h3>${ov.pct===100?"Trilha concluída — mandou bem!":ov.pct===0?"Pronto para começar":"Você está a caminho"}</h3>
        <p>${ov.d} de ${ov.t} itens concluídos em ${state.abas.length} estágios.</p>
        <div class="track"><i style="width:${ov.pct}%"></i></div>
      </div>
    </div>

    <div class="section-label">acesso rápido</div>
    <div class="cards">${cards}</div>

    <div class="section-label">estágios da trilha</div>
    <div class="cards">${stages}</div>

    <div class="bar" style="margin-top:26px; justify-content:center; flex-wrap:wrap">
      <button class="ghost" data-action="export">⤓ Exportar</button>
      ${podeEditar() && !modoModelo?`<button class="ghost" data-action="import">⤒ Importar</button>`:""}
      ${modoModelo?"":`<button class="ghost" data-action="restore">↺ Zerar meu progresso</button>`}
      ${souAdmin?`<button class="ghost" data-action="modo-modelo">${modoModelo?"↩ voltar à minha trilha":"🛠 editar modelo oficial"}</button>`:""}
    </div>
    <p class="foot">${logado()
      ? `Sua trilha e seu progresso ficam na sua conta Google e acompanham você em qualquer aparelho.`
      : `A <b>trilha oficial</b> é só leitura. O seu <code>✓ concluído</code> fica neste navegador até você entrar.`}</p>
  </div>`;
}

function contaBtn(){
  if(!sbClient) return "";
  if(!logado()) return `<button class="ghost" data-action="entrar">🔑 Entrar com o Google</button>`;
  const av = meuAvatar();
  return `<span class="conta">${av?`<img src="${esc(av)}" alt="" referrerpolicy="no-referrer">`:"👤"}<b>${esc(meuNome())}</b></span>`+
         `<button class="ghost" data-action="sair">Sair</button>`;
}

function convite(texto){
  if(!sbClient) return "";   // sem SDK não há como logar: não prometer o que não dá
  return `<div class="convite"><p>${texto}</p>
    <button class="btn primary" data-action="entrar">🔑 Entrar com o Google</button></div>`;
}

function topBar(){ return `<div class="bar"><button class="ghost back" data-action="voltar">← Voltar</button><span class="spacer"></span>${contaBtn()}${themeBtn()}</div>`; }

/* Sem esta faixa é fácil editar o modelo achando que é a sua trilha — as
   duas telas são idênticas. Ela fica no topo de TODAS as telas enquanto o
   modo estiver ligado, não só na home. */
function faixaModelo(){
  if(!modoModelo) return "";
  return `<div class="faixa modelo">
    <span>🛠 <b>Editando a trilha oficial.</b> Vale para quem criar conta a partir de agora — quem já tem conta recebe como <i>novidade</i>. Seu progresso não aparece aqui.</span>
    <button class="btn" data-action="modo-modelo">↩ voltar à minha trilha</button>
  </div>`;
}

function faixaNovidades(){
  const n = contarNovidades();
  if(!n || modoModelo || route()!=="home") return "";
  return `<div class="faixa nov">
    <span>✨ <b>${n} novidade${n===1?"":"s"}</b> na trilha oficial que você ainda não tem.</span>
    <button class="btn primary" data-go="novidades">Ver o que mudou</button>
  </div>`;
}

/* Tela das novidades: lista com seleção, e duas saídas — trazer ou
   dispensar. Dispensar é definitivo de propósito; é o que impede um tema
   que você apagou de propósito de reaparecer para sempre. */
function viewNovidades(){
  if(!novidades){
    return `<div class="wrap">${topBar()}
      <div class="sec-head"><div class="eyebrow">novidades</div><h2>✨ Nada novo por aqui</h2>
        <p>Sua trilha já tem tudo o que existe na oficial. Quando ela ganhar um tema ou um item, aparece aqui.</p></div>
      <div class="empty-state"><div class="big">✅</div><p>Você está em dia.</p></div></div>`;
  }

  const linhaTema = mt=>`<li class="item nov-item">
    <input type="checkbox" class="nov-check" data-nov="${mt.id}" data-tipo="tema" id="nov-${mt.id}" checked>
    <div class="item-body">
      <label class="item-text" for="nov-${mt.id}">${mt.emoji} ${esc(mt.nome)}</label>
      <p class="item-detail">${esc(mt.resumo||"")}</p>
      <span class="chip">tema novo · ${(mt.itens||[]).length} ${(mt.itens||[]).length===1?"item":"itens"}</span>
    </div></li>`;

  const linhaItem = n=>`<li class="item nov-item">
    <input type="checkbox" class="nov-check" data-nov="${n.item.id}" data-tipo="item" id="nov-${n.item.id}" checked>
    <div class="item-body">
      <label class="item-text" for="nov-${n.item.id}">${esc(n.item.texto)}</label>
      ${n.item.detalhe?`<p class="item-detail">${esc(n.item.detalhe)}</p>`:""}
      <span class="chip">${n.destino.emoji} ${esc(n.destino.nome)}</span>
    </div></li>`;

  const linhaMat = n=>`<li class="item nov-item">
    <input type="checkbox" class="nov-check" data-nov="${n.mat.id}" data-tipo="material" id="nov-${n.mat.id}" checked>
    <div class="item-body">
      <label class="item-text" for="nov-${n.mat.id}">${(TIPOS_MAT[n.mat.tipo]||TIPOS_MAT.outro).emoji} ${esc(n.mat.titulo)}</label>
      ${n.mat.url?`<p class="item-detail">${esc(dominio(n.mat.url) || n.mat.url)}</p>`:""}
      <span class="chip">${n.destino.emoji} ${esc(n.destino.nome)}</span>
    </div></li>`;

  const mats = novidades.materiais || [];
  const blocos =
    (novidades.temas.length ? `<div class="section-label">temas novos</div>
      <ul class="list">${novidades.temas.map(linhaTema).join("")}</ul>` : "") +
    (novidades.itens.length ? `<div class="section-label">itens novos em temas que você já tem</div>
      <ul class="list">${novidades.itens.map(linhaItem).join("")}</ul>` : "") +
    (mats.length ? `<div class="section-label">materiais novos em temas que você já tem</div>
      <ul class="list">${mats.map(linhaMat).join("")}</ul>` : "");

  return `<div class="wrap">
    ${topBar()}
    <div class="sec-head">
      <div class="eyebrow">novidades — ${contarNovidades()}</div>
      <h2>✨ O que mudou na trilha oficial</h2>
      <p>Sua trilha é uma cópia sua: ela não muda sozinha. Escolha o que quer trazer. O que você <b>dispensar</b> não é oferecido de novo.</p>
    </div>
    ${blocos}
    <div class="bar" style="margin-top:20px; flex-wrap:wrap">
      <button class="btn primary" data-action="nov-add">＋ Adicionar selecionados</button>
      <button class="btn" data-action="nov-dispensar">✕ Dispensar selecionados</button>
      <span class="spacer"></span>
      <button class="ghost" data-action="nov-todos">Marcar todos</button>
      <button class="ghost" data-action="nov-nenhum">Desmarcar todos</button>
    </div>
    <p class="foot">Adicionar cria os itens na <b>sua</b> trilha, sem tocar nas suas anotações nem no seu progresso.</p>
  </div>`;
}

/* O selo do item concluído. Sem data (visitante, ou item marcado antes de a
   coluna existir) ele volta a ser exatamente o que era — nada quebra. */
function selo(id){
  const iso = progressoEm.get(id);
  const dt  = iso ? diaCurto(iso) : "";
  return `<span class="pill-done">✓ pronto${dt?` · ${dt}`:""}</span>`;
}

/* A nota fica na SUA cópia. Mesmo padrão do editingId já usado para editar
   item e tema: um só id aberto por vez, e o formulário nasce no render. */
function blocoNota(it){
  if(editingNota === it.id){
    return `<form class="edit-form nota-form" data-form-nota="${it.id}">
      <textarea name="nota" maxlength="2000" rows="4" placeholder="O que você aprendeu, links, dúvidas…">${esc(it.nota||"")}</textarea>
      <div class="row">
        <button type="button" class="btn" data-action="nota-cancel">Cancelar</button>
        <button type="submit" class="btn primary">Salvar nota</button>
      </div>
    </form>`;
  }
  return it.nota ? `<p class="item-nota">${esc(it.nota)}</p>` : "";
}

function acoesItem(it){
  /* O ✨ aparece mesmo para quem não pode editar: explicar não escreve
     nada. Só salvar como anotação exige a sua cópia. */
  const ia = (podeUsarIA() && !it.novo)
    ? `<button class="mini ia" data-action="ia-explicar" title="Explicar este item">✨</button>` : "";
  if(!podeEditar()) return ia ? `<div class="item-actions">${ia}</div>` : `<span></span>`;
  /* O ponto no botão diz que existe nota sem obrigar a abrir para descobrir. */
  const nota = (temNota && !modoModelo)
    ? `<button class="mini ${it.nota?"com-nota":""}" data-action="nota" title="Anotações">📝${it.nota?" •":""}</button>`
    : "";
  /* Some no modo modelo de propósito: o trigger de cadastro copia os itens do
     modelo sem olhar arquivado_em, então um item arquivado LÁ continuaria
     nascendo ativo em toda conta nova — inconsistência mais barata de não
     deixar existir do que de consertar depois. */
  const arq = (temArquivo && !modoModelo && !it.novo)
    ? `<button class="mini" data-action="arquivar" title="Arquivar — sai da lista; o que você já estudou continua contando">🗄</button>`
    : "";
  return `<div class="item-actions">${ia}${nota}<button class="mini" data-action="edit">editar</button>${arq}<button class="mini danger" data-action="delete">excluir</button></div>`;
}

/* ========================= Telas da IA ========================= */
/* Regra que vale para tudo aqui: a IA PROPÕE, você ACEITA. Nada que ela
   devolve vira linha no banco sem passar por uma caixinha marcada — o
   mesmo fluxo da tela de novidades, que já é familiar. */

function podeUsarIA(){ return temIA && logado() && !offline && !modoModelo; }

/* Botões no topo do tema. Só existem quando a IA está configurada. */
function blocoIaTema(aba){
  if(!podeUsarIA()) return "";
  const resta = iaLimite ? ` <span class="ia-resta">${Math.max(0, iaLimite - iaUsadas)} usos hoje</span>` : "";
  return `<div class="ia-acoes">
    ${temMateriais?`<button class="mini ia" data-action="ia-materiais">✨ buscar materiais</button>`:""}
    <button class="mini ia" data-action="ia-cartoes">✨ gerar cartões de revisão</button>
    ${resta}
  </div>`;
}

/* Explicação de um item: chega escrevendo e pode virar anotação. */
function blocoExplicacao(it){
  if(iaExplicando !== it.id) return "";
  const corpo = iaTexto
    ? `<p class="ia-texto">${esc(iaTexto)}</p>`
    : `<p class="ia-texto pensando">✨ pensando…</p>`;
  return `<div class="ia-caixa">
    ${corpo}
    <div class="row">
      <button type="button" class="btn" data-action="ia-fechar-explicacao">Fechar</button>
      ${iaTexto && podeEditar()?`<button type="button" class="btn primary" data-action="ia-virar-nota">📝 Salvar como anotação</button>`:""}
    </div>
  </div>`;
}

/* Painel de propostas — materiais ou cartões. Uma lista com caixinhas,
   igual à tela de novidades. */
function painelIA(aba){
  if(!iaPainel || iaPainel.abaId !== aba.id) return "";

  if(iaPainel.carregando){
    return `<div class="ia-painel"><div class="section-label">✨ ${iaPainel.tipo === "materiais" ? "procurando materiais" : "montando cartões"}</div>
      <p class="ia-texto pensando">${iaPainel.tipo === "materiais"
        ? "Lembrando de materiais do tema e conferindo o que você já salvou…"
        : "Lendo suas anotações e os itens concluídos…"}</p></div>`;
  }
  if(iaPainel.erro){
    return `<div class="ia-painel"><div class="section-label">✨ não deu</div>
      <p class="ia-texto">${esc(iaPainel.erro)}</p>
      <div class="row"><button class="btn" data-action="ia-fechar-painel">Fechar</button></div></div>`;
  }

  const itens = iaPainel.itens || [];
  if(!itens.length){
    return `<div class="ia-painel"><div class="section-label">✨ nada novo</div>
      <p class="ia-texto">${iaPainel.tipo === "materiais"
        ? "A IA não achou nada que já não estivesse na sua lista."
        : "Não encontrei conteúdo suficiente. Anote alguma coisa nos itens e tente de novo — os cartões saem das suas anotações."}</p>
      <div class="row"><button class="btn" data-action="ia-fechar-painel">Fechar</button></div></div>`;
  }

  const linhas = itens.map((x,k)=>{
    if(iaPainel.tipo === "materiais"){
      const t = TIPOS_MAT[x.tipo] || TIPOS_MAT.outro;
      const href = urlSegura(x.url);
      /* Três estados, não dois. Sem busca na web, a IA foi instruída a
         deixar o endereço VAZIO em vez de inventar um link — e vazio é o
         resultado certo, não um defeito. Só merece vermelho o endereço
         que veio preenchido e não serve. */
      const proc = href ? esc(dominio(href))
        : (String(x.url||"").trim()
            ? `<span class="perigo">endereço inválido — não será salvo como link</span>`
            : "sem link — procure pelo título");
      return `<li class="item nov-item">
        <input type="checkbox" class="nov-check" data-ia="${k}" id="ia-${k}" checked>
        <div class="item-body">
          <label class="item-text" for="ia-${k}">${t.emoji} ${esc(x.titulo)}</label>
          <p class="item-detail">${proc}${x.nota?` · ${esc(x.nota)}`:""}</p>
        </div></li>`;
    }
    return `<li class="item nov-item">
      <input type="checkbox" class="nov-check" data-ia="${k}" id="ia-${k}" checked>
      <div class="item-body">
        <label class="item-text" for="ia-${k}">${esc(x.pergunta)}</label>
        <p class="item-detail">${esc(x.resposta)}</p>
      </div></li>`;
  }).join("");

  return `<div class="ia-painel">
    <div class="section-label">✨ ${iaPainel.tipo === "materiais" ? "materiais sugeridos" : "cartões sugeridos"} — ${itens.length}</div>
    <p class="ia-texto aviso">Confira antes de aceitar. A IA erra, e o que você aceitar vira conteúdo seu.</p>
    <ul class="list">${linhas}</ul>
    <div class="bar" style="margin-top:14px; flex-wrap:wrap">
      <button class="btn primary" data-action="ia-aceitar">＋ Adicionar selecionados</button>
      <button class="btn" data-action="ia-fechar-painel">Dispensar tudo</button>
    </div>
  </div>`;
}

/* Chat: botão flutuante dentro do tema. A conversa mora no localStorage —
   é pessoal, não custa tabela nem policy, e some quando você quiser. */
function chaveChat(abaId){ return `estudos-ia-chat:${abaId}`; }
function lerChat(abaId){
  try{ const a = JSON.parse(localStorage.getItem(chaveChat(abaId))||"[]"); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function salvarChat(abaId){
  try{ localStorage.setItem(chaveChat(abaId), JSON.stringify(chatMsgs.slice(-30))); }catch(e){}
}

function blocoChat(aba){
  if(!podeUsarIA()) return "";
  if(!chatAberto) return `<button class="chat-bolha" data-action="chat-abrir" title="Conversar sobre este tema">💬</button>`;

  const linhas = chatMsgs.map(m=>`<div class="chat-msg ${m.role}">
    <span class="chat-quem">${m.role === "user" ? "você" : "✨"}</span>
    <p>${esc(m.content)}</p></div>`).join("");

  return `<div class="chat-painel">
    <div class="chat-topo">
      <span>💬 falando sobre <b>${esc(aba.nome)}</b></span>
      <span class="spacer"></span>
      ${chatMsgs.length?`<button class="mini" data-action="chat-limpar">limpar</button>`:""}
      <button class="mini" data-action="chat-fechar">✕</button>
    </div>
    <div class="chat-corpo">
      ${linhas || `<p class="ia-texto pensando">Pergunte o que quiser sobre este tema. A IA já sabe o que você concluiu e o que anotou.</p>`}
      ${chatPensando?`<div class="chat-msg assistant"><span class="chat-quem">✨</span><p class="pensando">pensando…</p></div>`:""}
    </div>
    <form class="edit-form chat-form" data-form-chat="${aba.id}">
      <input name="texto" placeholder="Escreva sua pergunta…" maxlength="2000" autocomplete="off" required${chatPensando?" disabled":""}>
    </form>
  </div>`;
}

/* --------------------- Tela de revisão --------------------- */
async function carregarCartoes(){
  cartoes = [];
  if(!logado() || offline) return;
  const hoje = new Date().toISOString().slice(0,10);
  try{
    cartoes = await sbFetch(`ia_cartoes?select=*&proxima_revisao=lte.${hoje}&order=proxima_revisao&limit=50`) || [];
  }catch(e){ cartoes = []; }   // tabela ainda não existe: tela avisa
}

function viewRevisar(){
  if(!logado()){
    return `<div class="wrap">${topBar()}
      <div class="sec-head"><div class="eyebrow">revisão</div><h2>🔁 Revisar</h2>
        <p>Os cartões ficam na sua conta.</p></div>
      ${convite("Entre com o Google para revisar seus cartões.")}</div>`;

/* ========================= Histórico ==========================
   O lugar para onde olhar ANTES de excluir qualquer coisa. Duas listas
   que respondem à mesma pergunta — "cadê o que eu já fiz?" — e nenhuma
   das duas está no `state`: o carregarTrilha() filtra o arquivado, e um
   item concluído pode estar num tema que você arquivou.

   As duas chegam juntas, então o chip da tela não dispara rede: ele só
   troca a lista, exatamente como o mat-filtro já faz.
============================================================== */

/* ==================== Projetos e tarefas ====================
   Fase 2a: tudo pessoal. A coluna grupo_id já existe no banco e fica
   nula — compartilhar, na 2b, é preencher o campo.
============================================================== */

function podeProjetos(){ return temProjetos && logado() && !offline && !modoModelo; }

/* O embed traz o status de cada tarefa junto, e é ele que dá o contador
   "4/9" sem uma segunda requisição. Os arquivados vêm no mesmo bolo: o
   filtro é no cliente, como em viewMateriais(), e assim o chip já sabe a
   conta sem perguntar de novo. */
async function carregarProjetos(){
  projetos = [];
  if(!podeProjetos()) return;
  try{
    projetos = await sbFetch(
      "projetos?select=id,nome,descricao,ordem,grupo_id,arquivado_em,tarefas(status)&order=ordem"
    ) || [];
  }catch(e){ console.error("Projetos:", e); projetos = []; }
}

async function carregarProjeto(id){
  projetoAberto = null; tarefas = [];
  if(!podeProjetos()) return;
  try{
    const r = await sbFetch(`projetos?select=*,tarefas(*)&id=eq.${encodeURIComponent(id)}&limit=1`);
    const p = Array.isArray(r) ? r[0] : null;
    /* Não distingue "não existe" de "o RLS filtrou" — e para a TELA isso é
       o certo. Como prova de RLS não serve para nada, e é justamente a
       "versão fraca do teste" que o PLANO.md descreve. */
    if(!p) return;
    tarefas = (p.tarefas||[]).sort((a,b)=>(a.ordem||0)-(b.ordem||0));   // o embed não garante ordem
    delete p.tarefas;
    projetoAberto = p;
  }catch(e){ console.error("Projeto:", e); projetoAberto = null; tarefas = []; }
}

function acharTarefa(id){ return tarefas.find(t=>t.id===id) || null; }
function acharProjeto(id){ return projetos.find(p=>p.id===id) || null; }

/* ⚠ prazo é `date`, não `timestamptz`, e chega como "2026-08-03". Passar isso
   por new Date() o interpreta como MEIA-NOITE EM UTC — e em São Paulo (UTC-3)
   o .getDate() devolve o dia ANTERIOR. O diaCurto() cai nessa armadilha porque
   foi escrito para concluido_em, que é timestamptz. Montar a data por partes é
   o conserto, e é o espelho exato do chaveDia(). */
function diaDoPrazo(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); if(!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}
function chipPrazo(t){
  const d = diaDoPrazo(t.prazo); if(!d) return "";
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const venceu = t.status !== "feito" && d < hoje;
  return `<span class="chip prazo ${venceu?"venceu":""}">⏰ ${String(d.getDate()).padStart(2,"0")}/${MES_CURTO[d.getMonth()]}${venceu?" · atrasada":""}</span>`;
}

/* Cabeçalho de grupo. Mesmo motivo do chaveDia(): a data vem em UTC e o
   mês tem que ser o do APARELHO, senão a virada do mês pula de grupo. */
const fmtMes = new Intl.DateTimeFormat("pt-BR", { month:"long", year:"numeric" });
function mesDe(iso){ const d = new Date(iso); return isNaN(d) ? "sem data" : fmtMes.format(d); }

/* Relação to-one do PostgREST vem como objeto; to-many, como array. Este
   helper aceita os dois e evita um `.nome` de undefined. */
const umSo = x => Array.isArray(x) ? x[0] : x;

async function carregarHistorico(){
  if(!logado() || offline){
    historico = Object.assign(montarHistoricoLocal(), { parcial:true });
    return;
  }
  try{
    /* O caminho progresso → itens → temas existe nas chaves estrangeiras
       desde a migração de contas; o PostgREST desce por elas numa
       requisição só, e o RLS continua valendo em cada nível.
       progressoEm NÃO entra aqui: a data vem do próprio concluido_em. */
    const pedidos = [
      sbFetch(`progresso?select=item_id,concluido_em,itens(texto${temNota?",nota":""},temas(nome,emoji))&order=concluido_em.desc&limit=1000`)
    ];
    if(temArquivo){
      pedidos.push(sbFetch(`itens?arquivado_em=not.is.null&user_id=eq.${sessao.user.id}&select=id,texto,arquivado_em,temas(nome,emoji)&order=arquivado_em.desc&limit=500`));
      pedidos.push(sbFetch(`temas?arquivado_em=not.is.null&user_id=eq.${sessao.user.id}&select=id,nome,emoji,arquivado_em,itens(id)&order=arquivado_em.desc&limit=200`));
    }
    const [prog, itensArq, temasArq] = await Promise.all(pedidos);
    historico = {
      parcial: false,
      feitos: (prog||[]).map(l=>{
        const it = umSo(l.itens) || {}, tm = umSo(it.temas) || {};
        return { id:l.item_id, iso:l.concluido_em, texto: it.texto || "(item removido)",
                 nota: it.nota || "", tema: tm.nome || "", emoji: tm.emoji || "📘" };
      }),
      itens: (itensArq||[]).map(i=>{
        const tm = umSo(i.temas) || {};
        return { id:i.id, texto:i.texto, iso:i.arquivado_em, tema:tm.nome||"", emoji:tm.emoji||"📘" };
      }),
      temas: (temasArq||[]).map(t=>({
        id:t.id, texto:t.nome, iso:t.arquivado_em, emoji:t.emoji||"📘", n:(t.itens||[]).length
      }))
    };
  }catch(e){
    console.error("Histórico:", e);
    historico = Object.assign(montarHistoricoLocal(), { parcial:true });
  }
}

/* Reserva para quem está sem rede ou deslogado. progressoEm tem TODAS as
   datas, inclusive as de item arquivado — mas o TEXTO só existe para o
   que está no state. Por isso ela é reserva e não a fonte, e a tela diz
   em voz alta que está incompleta. */
function montarHistoricoLocal(){
  const feitos = [];
  if(state) state.abas.forEach(a=>a.itens.forEach(it=>{
    if(!progresso.has(it.id)) return;
    feitos.push({ id:it.id, iso: progressoEm.get(it.id)||"", texto:it.texto,
                  nota:it.nota||"", tema:a.nome, emoji:a.emoji });
  }));
  feitos.sort((x,y)=>String(y.iso).localeCompare(String(x.iso)));
  return { feitos, itens: [], temas: [] };
}

function viewHistorico(){
  const h = historico;
  if(h === null){
    return `<div class="wrap">${topBar()}<div class="empty-state">
      <div class="big">⏳</div><p>Buscando o que você já fez…</p></div></div>`;
  }
  const nf = h.feitos.length, na = h.itens.length + h.temas.length;

  const chips = `<div class="prog-inline mat-filtros">
    <button class="mini ${filtroHist==="feitos"?"on":""}" data-action="hist-filtro" data-tipo="feitos">✓ concluídos ${nf}</button>
    ${temArquivo?`<button class="mini ${filtroHist==="arquivados"?"on":""}" data-action="hist-filtro" data-tipo="arquivados">🗄 arquivados ${na}</button>`:""}
  </div>`;

  let corpo;
  if(filtroHist === "arquivados"){
    if(!na){
      corpo = `<div class="empty-state"><div class="big">🗄</div>
        <p class="item-text" style="color:var(--ink)">Nada arquivado</p>
        <p>Use 🗄 num item ou tema para tirá-lo da lista de estudo sem perder o que você já estudou nele.</p></div>`;
    } else {
      corpo =
        (h.temas.length?`<div class="section-label">temas arquivados</div>
          <ul class="list">${h.temas.map(t=>linhaArquivada(t, true)).join("")}</ul>`:"")
      + (h.itens.length?`<div class="section-label">itens arquivados</div>
          <ul class="list">${h.itens.map(i=>linhaArquivada(i, false)).join("")}</ul>`:"");
    }
  } else if(!nf){
    corpo = `<div class="empty-state"><div class="big">📜</div>
      <p class="item-text" style="color:var(--ink)">Nada concluído ainda</p>
      <p>Assim que você marcar o primeiro ✓, ele aparece aqui — com a data e a sua anotação.</p></div>`;
  } else {
    /* Agrupado por mês, sequencialmente: a lista já vem do mais recente
       para o mais antigo, e reordenar aqui criaria uma segunda fonte da
       verdade sobre a ordem. */
    const grupos = [];
    h.feitos.forEach(f=>{
      const k = String(f.iso||"").slice(0,7) || "sem-data";
      const ult = grupos[grupos.length-1];
      if(!ult || ult.k !== k) grupos.push({ k, rotulo: f.iso?mesDe(f.iso):"sem data", linhas:[f] });
      else ult.linhas.push(f);
    });
    corpo = grupos.map(g=>`<div class="section-label">${esc(g.rotulo)}</div>
      <ul class="list">${g.linhas.map(linhaHistorico).join("")}</ul>`).join("");
  }

  return `<div class="wrap">${topBar()}
    <div class="sec-head">
      <div class="eyebrow">histórico — ${nf} conclusõe${nf===1?"":"s"}</div>
      <h2>📜 Histórico</h2>
      <p>Tudo que você já concluiu, do mais recente para o mais antigo, com a sua anotação. Arquivar um item tira ele da lista de estudo — <b>nada aqui deixa de contar por causa disso</b>.</p>
      ${chips}
    </div>
    ${!logado()?convite("As datas ficam na sua conta. Sem login, este navegador guarda só o ✓ — não o <b>quando</b>."):""}
    ${h.parcial&&logado()?`<p class="foot" style="text-align:left">Sem conexão: mostrando só o que está neste aparelho.</p>`:""}
    ${corpo}
  </div>`;
}

/* Card da sequência. Deslogado não há data nenhuma para mostrar — em vez de
   um zero que parece derrota, explica por quê e convida a entrar. */
function cardSequencia(dias){
  if(!logado()){
    return `<div class="rcard"><h4>Sequência</h4>
      <p class="rcard-hint">As datas ficam na sua conta. Sem login, este navegador guarda só o ✓ — não o <b>quando</b>.</p>
      ${convite("Entre com o Google para acompanhar seus dias seguidos de estudo.")}</div>`;
  }
  const seq = calcularSequencia(new Set(dias.keys()), new Date());
  let ultimo = 0;
  progressoEm.forEach(iso=>{ const t = +new Date(iso); if(t > ultimo) ultimo = t; });
  return `<div class="rcard"><h4>Sequência</h4>
    <div class="streak ${seq?"on":""}">
      <b class="mono">${seq}</b>
      <span>dia${seq===1?"":"s"} seguidos</span>
    </div>
    <div class="streak-sub">
      <div><b class="mono">${dias.size}</b><span>dias com estudo</span></div>
      <div><b class="mono">${ultimo?diaCurto(new Date(ultimo).toISOString()):"—"}</b><span>último estudo</span></div>
    </div></div>`;
}

/* Mapa de atividade: 12 semanas × 7 dias, um CSS grid puro e nenhuma
   biblioteca. As colunas são semanas (domingo em cima), por isso o intervalo
   começa num domingo e termina no sábado da semana atual. */
function cardAtividade(dias){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const fim  = new Date(hoje); fim.setDate(fim.getDate() + (6 - fim.getDay()));   // sábado desta semana
  const ini  = new Date(fim);  ini.setDate(ini.getDate() - (12*7 - 1));           // 84 casas, começa num domingo

  const cel = [];
  for(let d = new Date(ini); d <= fim; d.setDate(d.getDate()+1)){
    const k = chaveDia(d), n = dias.get(k) || 0;
    const nivel  = !n ? "" : n===1 ? "n1" : n<=3 ? "n2" : "n3";
    const rotulo = `${String(d.getDate()).padStart(2,"0")}/${MES_CURTO[d.getMonth()]}`;
    cel.push(`<i class="hc ${nivel} ${d>hoje?"fut":""}" title="${rotulo} — ${n} ${n===1?"item":"itens"}"></i>`);
  }

  const total = [...dias.values()].reduce((s,n)=>s+n, 0);
  return `<div class="rcard"><h4>Atividade — 12 semanas</h4>
    <div class="heat">${cel.join("")}</div>
    <div class="heat-foot">
      <span>${logado() ? `${total} conclusõe${total===1?"":"s"} no período` : "entre para registrar datas"}</span>
      <span class="heat-leg">menos <i class="hc"></i><i class="hc n1"></i><i class="hc n2"></i><i class="hc n3"></i> mais</span>
    </div></div>`;
}

/* Faixa de rede — no TOPO, não no rodapé. No celular ninguém rola até o fim
   para descobrir por que o app está estranho. E ela diz a verdade inteira:
   de quando é o que está na tela, e quantas alterações ainda vão subir. */
function faixaRede(){
  const p = pendentes();
  if(!offline && !p) return "";

  if(!sbLigado()){
    return `<div class="faixa rede"><span>⚠ <b>Sem banco configurado</b> — a anon key não foi preenchida no topo do arquivo.</span></div>`;
  }

  const naFila = p ? ` <b>${p}</b> alteraç${p===1?"ão espera":"ões esperam"} envio.` : "";

  if(offline){
    const dt = retratoDe ? quando(retratoDe) : "";
    return `<div class="faixa rede">
      <span>📴 <b>Sem conexão com o banco.</b> ${dt
        ? `Você está vendo a sua trilha como estava em <b>${dt}</b>.`
        : `Você está vendo o conteúdo local.`} O que mudar agora sobe sozinho quando a rede voltar.${naFila}</span>
      <button class="btn" data-action="reconectar">↻ Tentar agora</button>
    </div>`;
  }

  return `<div class="faixa rede">
    <span>↻${naFila}</span>
    <button class="btn" data-action="reconectar">Enviar agora</button>
  </div>`;
}

function render(){
  if(carregando){
    $("#app").innerHTML = `<div class="wrap"><div class="empty-state">
      <div class="big">⏳</div><p>Carregando a trilha…</p></div></div>`;
    return;
  }
  const r = route();
  let html;
  if(r==="home") html = viewHome();
  else if(r==="afazer") html = viewAfazer();
  else if(r==="resumo") html = viewResumo();
  else if(r==="mural") html = viewMural();
  else if(r==="novidades") html = viewNovidades();
  else if(r==="materiais") html = viewMateriais();
  else if(r==="revisar") html = viewRevisar();
  else if(r==="historico") html = viewHistorico();
  else if(r==="projetos") html = viewProjetos();
  /* A rota tem barra, e o `else` abaixo trataria "projeto/<uuid>" como slug de
     tema. Não há colisão possível: slugUnico() passa por slugify(), que troca
     tudo que não é [a-z0-9] por "-", então id de aba NUNCA contém "/". */
  else if(r.startsWith("projeto/")) html = viewProjeto(r.slice(8));
  else { const idx = state.abas.findIndex(a=>a.id===r); if(idx<0){ location.hash=""; return; } html = viewStage(idx); }
  $("#app").innerHTML = faixaRede() + faixaModelo() + faixaNovidades() + html;
}

/* ============================ Ações ============================ */
document.addEventListener("click", async e=>{
  /* data-action é consultado antes de data-go: assim um botão de ação dentro
     de um card navegável vence a navegação do card que o contém. */
  const act = e.target.closest("[data-action]");
  if(!act){
    const goEl = e.target.closest("[data-go]");
    if(goEl) go(goEl.dataset.go);
    return;
  }
  const action = act.dataset.action;
  const li = act.closest(".item"); const id = li?.dataset.id;
  const matId = act.closest("[data-mat]")?.dataset.mat;
  /* Tarefa não precisa de linha aqui: ela usa <li class="item" data-id>, que
     o `id` acima já cobre. Projeto tem contêiner próprio, como material. */
  const projId = act.closest("[data-proj]")?.dataset.proj;

  switch(action){
    case "reconectar":
      ultimaTentativa = 0;   // pedido explícito ignora o freio dos 5s
      carregando = true; render();
      await tentarReconectar();
      carregando = false; render();
      break;

    case "voltar": if(history.length>1){ history.back(); } else { go("home"); } break;
    case "theme": toggleTheme(); break;
    case "entrar": await entrar(); break;
    case "sair": await sair(); break;
    case "export": exportJSON(); break;
    case "import": $("#fileIn").click(); break;

    case "restore":
      /* A trilha agora é compartilhada — zerar o conteúdo apagaria o de todos.
         Este botão passa a zerar só o SEU progresso. Trocar a trilha inteira
         vem na Etapa 4 (Importar). */
      if(confirm("Zerar o seu progresso? O conteúdo da trilha não é afetado.")){
        const zerados = [...progresso];
        progresso.clear(); progressoEm.clear();
        salvarProgresso(); aplicarProgresso(state); editingId=null; render();
        await sincProgresso(zerados, false);
      } break;

    case "toggle":{
      const f=findItem(id); if(!f) break;
      f.it.feito = !f.it.feito; marcarItem(id, f.it.feito); render();
      await sincProgresso([id], f.it.feito);
      break;
    }

    case "toggle-all":{
      const marcar = act.dataset.marcar === "1";
      const alvo = route()==="afazer"
        ? state.abas
        : [state.abas.find(a=>a.id===route())].filter(Boolean);

      /* Compara o Set antes e depois em vez de assumir o que a função fez —
         assim a regra que VOCÊ escreveu no marcarTodosDoTema continua valendo,
         e o servidor recebe exatamente o que mudou. */
      const antes = new Set(progresso);
      alvo.forEach(aba => marcarTodosDoTema(aba, marcar));
      aplicarProgresso(state);   // re-sincroniza os ✓ a partir do Set
      render();

      const incluidos = [...progresso].filter(x=>!antes.has(x));
      const removidos = [...antes].filter(x=>!progresso.has(x));
      if(incluidos.length) await sincProgresso(incluidos, true);
      if(removidos.length) await sincProgresso(removidos, false);
      break;
    }

    /* ---------------------- Gestão de temas ---------------------- */
    case "tema-edit": editingAba = route(); editingId = null; render(); focusTema(); break;

    case "tema-cancel":{
      const aba = state.abas.find(a=>a.id===editingAba);
      editingAba = null;
      if(aba && aba.novo){ state.abas = state.abas.filter(a=>a!==aba); go("home"); }
      else render();
      break;
    }

    case "tema-novo":{
      /* Igual ao item novo: nasce só na memória e só vira linha no banco
         quando você salvar — assim cancelar não deixa lixo para os outros. */
      const tmp = "novo-"+uid();
      const ordem = state.abas.reduce((m,a)=>Math.max(m, a.ordem||0), 0) + 1;
      state.abas.push({ id:tmp, dbId:null, nome:"", emoji:"📘", resumo:"", ordem, itens:[], novo:true });
      editingAba = tmp; editingId = null;
      go(tmp); focusTema();
      break;
    }

    case "tema-arquivar":{
      const aba = state.abas.find(a=>a.id===route()); if(!aba || !aba.dbId) break;
      const dbId = aba.dbId;
      /* Não mexe no arquivado_em dos ITENS: evita um update em massa e faz o
         desarquivar ser reversível de verdade — o tema volta exatamente como
         estava, inclusive com os itens que você tinha arquivado um a um. */
      state.abas = state.abas.filter(a=>a!==aba);
      go("home");   // a rota #<slug> deixou de existir: sair ANTES de renderizar
      await salvarNoServidor(()=> sbFetch(`temas?id=eq.${dbId}`,
        {method:"PATCH", body: JSON.stringify({ arquivado_em: new Date().toISOString() })}));
      break;
    }

    case "tema-delete":{
      const aba = state.abas.find(a=>a.id===route()); if(!aba) break;
      /* Sem o número de itens de propósito: com o arquivar ligado, aba.itens
         conta só os ATIVOS, mas o cascade leva os arquivados junto. Um número
         errado é pior que nenhum, e contar direito custaria uma requisição. */
      if(!confirm(`Excluir o tema "${aba.nome}" e TODOS os itens dele${temArquivo?" (inclusive os arquivados, que não aparecem nesta tela)":""}?\n\nIsso apaga também as datas em que você concluiu esses itens: a sequência de dias e o mapa de 12 semanas perdem esses dias, e os cartões somem.${temArquivo?"\n\nSe é só para tirar da lista, cancele e use 🗄 arquivar tema.":""}\n\nIsso afeta apenas a SUA trilha — a trilha oficial e a dos outros continuam intactas.`)) break;
      const dbId = aba.dbId;
      aba.itens.forEach(it=>{ progresso.delete(it.id); progressoEm.delete(it.id); }); salvarProgresso();
      state.abas = state.abas.filter(a=>a!==aba);
      go("home");
      if(dbId) await salvarNoServidor(()=> sbFetch(`temas?id=eq.${dbId}`, {method:"DELETE"}));
      break;
    }

    case "tema-up":
    case "tema-down":{
      const i = state.abas.findIndex(a=>a.id===route()); if(i<0) break;
      const j = action==="tema-up" ? i-1 : i+1;
      if(j<0 || j>=state.abas.length) break;
      [state.abas[i], state.abas[j]] = [state.abas[j], state.abas[i]];
      /* Renumera pela posição: conserta sozinho qualquer ordem duplicada. */
      const mudados = [];
      state.abas.forEach((a,k)=>{ if(a.ordem!==k+1){ a.ordem=k+1; mudados.push(a); } });
      render();
      await salvarNoServidor(async ()=>{
        for(const a of mudados){
          if(a.dbId) await sbFetch(`temas?id=eq.${a.dbId}`, {method:"PATCH", body: JSON.stringify({ordem:a.ordem})});
        }
      });
      break;
    }

    case "edit": editingId=id; render(); focusEdit(); break;

    case "cancel":{
      const f=findItem(editingId);
      if(f && (f.it.novo || !f.it.texto)){ f.aba.itens=f.aba.itens.filter(i=>i.id!==editingId); }
      editingId=null; render(); break;
    }

    case "delete":{
      const f=findItem(id); if(!f) break;
      /* Dois textos. Item pendente é rascunho: excluir não custa nada. Item
         CONCLUÍDO carrega a data em que você o concluiu, e o cascade a leva
         junto — a sequência e o mapa perdem esse dia sem aviso nenhum. É a
         perda invisível que este commit existe para nomear. */
      const aviso = progresso.has(id)
        ? `Excluir "${f.it.texto}"?\n\nEste item está CONCLUÍDO. Excluir apaga também a data em que você o concluiu: a sequência de dias e o mapa de 12 semanas perdem esse dia, e os cartões de revisão dele somem. Não tem desfazer.${temArquivo?"\n\nSe é só para tirar da lista, cancele e use 🗄 — assim o estudo continua contando.":""}`
        : "Excluir este item?";
      if(!confirm(aviso)) break;
      f.aba.itens = f.aba.itens.filter(i=>i.id!==id);
      /* progressoEm junto com o Set: a linha do banco vai embora por cascade,
         e deixar a data na memória faria a sequência contar um dia que o
         banco já não tem — até o próximo F5. */
      progresso.delete(id); progressoEm.delete(id); salvarProgresso();
      render();
      await salvarNoServidor(()=> sbFetch(`itens?id=eq.${id}`, {method:"DELETE"}));
      break;
    }

    case "arquivar":{
      const f = findItem(id); if(!f) break;
      /* Sem confirm(): arquivar não destrói nada e tem volta em dois cliques
         no #historico. A confirmação pesada fica no excluir, que é o que não
         volta. E o progresso NÃO é tocado — é exatamente isso que faz o item
         continuar contando na sequência, no mapa e no histórico. */
      f.aba.itens = f.aba.itens.filter(i=>i.id!==id);
      if(editingId===id) editingId = null;
      if(editingNota===id) editingNota = null;
      if(iaExplicando===id){ iaExplicando = null; iaTexto = ""; }
      render();
      await salvarNoServidor(()=> sbFetch(`itens?id=eq.${id}`,
        {method:"PATCH", body: JSON.stringify({ arquivado_em: new Date().toISOString() })}));
      break;
    }

    case "hist-filtro": filtroHist = act.dataset.tipo || "feitos"; render(); break;

    /* --------------------- Projetos e tarefas --------------------- */
    case "proj-filtro": filtroProj = act.dataset.f || "ativos"; render(); break;
    case "tar-filtro":  colunaTar  = act.dataset.col || "a_fazer"; render(); break;

    case "proj-novo":{
      /* Nasce só na memória: o banco exige nome não-vazio, então ele só vira
         linha quando você salvar o formulário. Mesma regra de item e material. */
      const nid = uid();
      const prox = projetos.reduce((m,p)=>Math.max(m, p.ordem||0), 0) + 1;
      projetos.push({ id:nid, nome:"", descricao:"", ordem:prox, tarefas:[], novo:true });
      filtroProj = "ativos"; editandoProj = nid; render();
      $(`[data-form-proj="${nid}"] input[name="nome"]`)?.focus();
      break;
    }
    case "proj-edit": editandoProj = (editandoProj===projId ? null : projId); render(); break;
    case "proj-cancel":{
      const p = acharProjeto(editandoProj);
      if(p && p.novo) projetos = projetos.filter(x=>x!==p);
      editandoProj = null; render(); break;
    }
    case "proj-arquivar":
    case "proj-desarquivar":{
      const p = acharProjeto(projId); if(!p || p.novo) break;
      const quando = action==="proj-arquivar" ? new Date().toISOString() : null;
      p.arquivado_em = quando; render();
      await salvarNoServidor(()=> sbFetch(`projetos?id=eq.${p.id}`,
        {method:"PATCH", body: JSON.stringify({ arquivado_em: quando })}));
      break;
    }
    case "proj-delete":{
      const p = acharProjeto(projId); if(!p) break;
      const n = (p.tarefas||[]).length;
      if(!confirm(`Excluir o projeto "${p.nome}"${n?` e as ${n} tarefa${n===1?"":"s"} dele`:""}?\n\nNão tem desfazer. Se é só para tirar da lista, cancele — ele já está arquivado.`)) break;
      projetos = projetos.filter(x=>x!==p);
      if(editandoProj===p.id) editandoProj = null;
      render();
      if(!p.novo) await salvarNoServidor(()=> sbFetch(`projetos?id=eq.${p.id}`, {method:"DELETE"}));
      break;
    }

    case "tar-add":{
      if(!projetoAberto) break;
      const nid = uid();
      const st = act.dataset.status || "a_fazer";
      const prox = tarefas.reduce((m,t)=>Math.max(m, t.ordem||0), 0) + 1;
      tarefas.push({ id:nid, projeto_id:projetoAberto.id, titulo:"", detalhe:"",
                     status:st, prazo:null, ordem:prox, novo:true });
      editandoTarefa = nid; render();
      $(`[data-form-tarefa="${nid}"] input[name="titulo"]`)?.focus();
      break;
    }
    case "tar-edit": editandoTarefa = (editandoTarefa===id ? null : id); render(); break;
    case "tar-cancel":{
      const t = acharTarefa(editandoTarefa);
      if(t && t.novo) tarefas = tarefas.filter(x=>x!==t);
      editandoTarefa = null; render(); break;
    }
    case "tar-mover":{
      const t = acharTarefa(id); if(!t || t.novo) break;
      const para = act.dataset.para; if(!COLUNAS[para]) break;
      t.status = para; render();   // otimista, como o toggle do item
      await salvarNoServidor(()=> sbFetch(`tarefas?id=eq.${t.id}`,
        {method:"PATCH", body: JSON.stringify({ status: para })}));
      break;
    }
    case "tar-delete":{
      const t = acharTarefa(id); if(!t) break;
      if(!t.novo && !confirm(`Excluir "${t.titulo}"?`)) break;
      const eraNovo = Boolean(t.novo);
      tarefas = tarefas.filter(x=>x!==t);
      if(editandoTarefa===t.id) editandoTarefa = null;
      render();
      if(!eraNovo) await salvarNoServidor(()=> sbFetch(`tarefas?id=eq.${t.id}`, {method:"DELETE"}));
      break;
    }

    case "desarquivar":
    case "tema-desarquivar":{
      if(!id) break;
      const alvo = action === "desarquivar" ? "itens" : "temas";
      carregando = true; render();
      await salvarNoServidor(()=> sbFetch(`${alvo}?id=eq.${id}`,
        {method:"PATCH", body: JSON.stringify({ arquivado_em: null })}));
      /* load() é o caminho de volta inteiro: devolve a linha ao state, ao
         stats(), ao viewAfazer() e ao #materiais de uma vez só, sem nenhuma
         lógica de reinserção que pudesse discordar do servidor. */
      state = await load();
      await carregarHistorico();
      carregando = false; render();
      break;
    }

    case "add":{
      /* Item novo nasce só na memória: o banco exige texto não-vazio, então ele
         só é criado de verdade quando você salvar o formulário. */
      const aba=state.abas.find(a=>a.id===route()); if(!aba) break;
      const nid=uid();
      const proxOrdem = aba.itens.reduce((m,i)=>Math.max(m, i.ordem||0), 0) + 1;
      aba.itens.push({id:nid, texto:"", detalhe:"", feito:false, novo:true, ordem:proxOrdem, nota:""});
      editingId=nid; render(); focusEdit(); break;
    }

    /* ------------------------- Anotações ------------------------- */
    case "nota": editingNota = (editingNota===id ? null : id); editingId=null; render(); focusNota(); break;
    case "nota-cancel": editingNota = null; render(); break;

    /* ---------------------------- IA ---------------------------- */
    case "ia-explicar":{
      const f = findItem(id); if(!f) break;
      iaExplicando = id; iaTexto = ""; editingId = editingNota = null; render();
      try{
        await iaStream({ acao:"explicar", temaId: f.aba.dbId, itemId: id }, texto=>{
          if(iaExplicando !== id) return;   // fechou no meio: para de desenhar
          iaTexto = texto; render();
        });
      }catch(e){
        iaTexto = "Não consegui explicar agora: " + e.message;
      }
      render(); break;
    }

    case "ia-fechar-explicacao": iaExplicando = null; iaTexto = ""; render(); break;

    case "ia-virar-nota":{
      const f = findItem(iaExplicando); if(!f || !iaTexto) break;
      /* A explicação vira anotação SUA — depois disso ela é conteúdo seu,
         editável, e é dela que os cartões de revisão vão sair. */
      const nota = iaTexto.slice(0,2000);
      f.it.nota = nota; const alvoId = f.it.id;
      iaExplicando = null; iaTexto = ""; render();
      await salvarNoServidor(()=> sbFetch(`itens?id=eq.${alvoId}`, {
        method:"PATCH", body: JSON.stringify({ nota })
      }));
      break;
    }

    case "ia-materiais":
    case "ia-cartoes":{
      const aba = state.abas.find(a=>a.id===route()); if(!aba) break;
      const tipo = action === "ia-materiais" ? "materiais" : "cartoes";
      iaPainel = { tipo, abaId: aba.id, carregando: true, itens: [], erro: "" };
      render();
      try{
        const r = await chamarIA({
          acao: tipo === "materiais" ? "buscar_materiais" : "cartoes",
          temaId: aba.dbId
        });
        iaUsadas++;
        const lista = tipo === "materiais" ? (r.sugestoes || []) : (r.cartoes || []);
        /* Não oferecer o que já está salvo: a IA foi instruída a evitar,
           mas conferir aqui é barato e não depende de ela obedecer. */
        /* Chave vazia fora do Set, senão a dedup se volta contra nós: um
           único material já salvo sem endereço faria TODA sugestão sem
           endereço ser descartada — e a tela diria "nada novo", sem erro
           nenhum. Sem busca na web, sugestão sem endereço é o caso comum. */
        const jaTenho = new Set((aba.materiais||[])
          .map(m=>(m.url||"").trim().toLowerCase()).filter(Boolean));
        const chave = x => String(x.url||"").trim().toLowerCase();
        iaPainel = {
          tipo, abaId: aba.id, carregando: false, erro: "",
          itens: tipo === "materiais"
            ? lista.filter(x=>x && x.titulo && !(chave(x) && jaTenho.has(chave(x))))
            : lista.filter(x=>x && x.pergunta && x.resposta)
        };
      }catch(e){
        iaPainel = { tipo, abaId: aba.id, carregando:false, itens:[], erro: e.message };
      }
      render(); break;
    }

    case "ia-fechar-painel": iaPainel = null; render(); break;

    case "ia-aceitar":{
      if(!iaPainel) break;
      const marcados = [...document.querySelectorAll("[data-ia]")].filter(c=>c.checked)
        .map(c=>iaPainel.itens[Number(c.dataset.ia)]).filter(Boolean);
      if(!marcados.length){ alert("Selecione ao menos um."); break; }
      const aba = state.abas.find(a=>a.id===iaPainel.abaId);
      const tipo = iaPainel.tipo;
      iaPainel = null; carregando = true; render();

      await salvarNoServidor(async ()=>{
        if(tipo === "materiais"){
          let o = (aba.materiais||[]).reduce((m,x)=>Math.max(m, x.ordem||0), 0);
          await sbFetch("materiais", { method:"POST", body: JSON.stringify(marcados.map(x=>({
            id: novoId(), tema_id: aba.dbId,
            titulo: String(x.titulo).slice(0,120),
            url: String(x.url||"").slice(0,500),
            tipo: TIPOS_MAT[x.tipo] ? x.tipo : "outro",
            nota: String(x.nota||"").slice(0,500),
            ordem: ++o
          })))});
        } else {
          const idsDoTema = new Set(aba.itens.map(i=>i.id));
          await sbFetch("ia_cartoes", { method:"POST", body: JSON.stringify(marcados.map(x=>({
            id: novoId(), tema_id: aba.dbId,
            /* Só aceita item_id que exista mesmo neste tema: a IA pode
               devolver um id inventado, e o banco recusaria a linha toda. */
            item_id: idsDoTema.has(x.item_id) ? x.item_id : null,
            pergunta: String(x.pergunta).slice(0,500),
            resposta: String(x.resposta).slice(0,2000)
          })))});
        }
      });
      state = await load();
      await carregarCartoes();
      carregando = false; render(); break;
    }

    /* --------------------------- Chat --------------------------- */
    case "chat-abrir":{
      const aba = state.abas.find(a=>a.id===route()); if(!aba) break;
      chatMsgs = lerChat(aba.id); chatAberto = true; render();
      requestAnimationFrame(()=>{ const i=document.querySelector("[data-form-chat] input"); if(i) i.focus(); });
      break;
    }
    case "chat-fechar": chatAberto = false; render(); break;
    case "chat-limpar":{
      const aba = state.abas.find(a=>a.id===route()); if(!aba) break;
      chatMsgs = []; salvarChat(aba.id); render(); break;
    }

    /* -------------------------- Revisão -------------------------- */
    case "rev-mostrar": cartaoAberto = true; render(); break;

    case "rev-acertei":
    case "rev-errei":{
      const c = cartoes[0]; if(!c) break;
      const acertou = action === "rev-acertei";
      /* A conta é do app, não da IA: acertou dobra o intervalo, errou
         volta ao começo. Exata, de graça e sem alucinação. */
      const intervalo = acertou ? Math.max(1, (c.intervalo_dias||1) * 2) : 1;
      const prox = new Date(); prox.setDate(prox.getDate() + intervalo);
      const campos = {
        intervalo_dias: intervalo,
        proxima_revisao: prox.toISOString().slice(0,10),
        acertos: (c.acertos||0) + (acertou?1:0),
        erros:   (c.erros||0)   + (acertou?0:1)
      };
      cartoes.shift(); cartaoAberto = false; render();
      await salvarNoServidor(()=> sbFetch(`ia_cartoes?id=eq.${c.id}`, {
        method:"PATCH", body: JSON.stringify(campos)
      }));
      break;
    }

    /* ------------------------- Materiais ------------------------- */
    case "mat-filtro": filtroMat = act.dataset.tipo || "todos"; render(); break;

    case "mat-add":{
      /* Igual ao item novo: nasce só na memória, porque o banco exige
         título não-vazio. Cancelar não deixa lixo para ninguém. */
      const aba = state.abas.find(a=>a.id===route()); if(!aba) break;
      if(!aba.materiais) aba.materiais = [];
      const nid = uid();
      const ordem = aba.materiais.reduce((m,x)=>Math.max(m, x.ordem||0), 0) + 1;
      aba.materiais.push({ id:nid, titulo:"", url:"", tipo:"outro", nota:"", ordem, novo:true });
      editingMat = nid; editingId = editingNota = null;
      render(); focusMat(); break;
    }

    case "mat-edit": editingMat = matId; editingId = editingNota = null; render(); focusMat(); break;

    case "mat-cancel":{
      const f = acharMaterial(editingMat);
      if(f && f.mat.novo) f.aba.materiais = f.aba.materiais.filter(x=>x!==f.mat);
      editingMat = null; render(); break;
    }

    case "mat-delete":{
      const f = acharMaterial(matId); if(!f) break;
      if(!confirm(`Excluir "${f.mat.titulo}"?`)) break;
      const eraNovo = Boolean(f.mat.novo);
      f.aba.materiais = f.aba.materiais.filter(x=>x!==f.mat);
      if(editingMat===matId) editingMat = null;
      render();
      if(!eraNovo) await salvarNoServidor(()=> sbFetch(`materiais?id=eq.${matId}`, {method:"DELETE"}));
      break;
    }

    /* ---------------------- Modelo oficial ---------------------- */
    case "modo-modelo":{
      if(!souAdmin) break;
      modoModelo = !modoModelo;
      editingId = editingAba = editingNota = null;
      carregando = true; render();
      state = await load();
      carregando = false;
      go("home"); render();
      break;
    }

    /* ------------------------ Novidades ------------------------ */
    case "nov-todos":
    case "nov-nenhum":
      document.querySelectorAll("[data-nov]").forEach(c=>{ c.checked = (action==="nov-todos"); });
      break;

    case "nov-add":
    case "nov-dispensar":{
      const marcados = [...document.querySelectorAll("[data-nov]")].filter(c=>c.checked);
      if(!marcados.length){ alert("Selecione ao menos uma novidade."); break; }
      const ids = new Set(marcados.map(c=>c.dataset.nov));

      if(action==="nov-dispensar"){
        if(!confirm(`Dispensar ${ids.size} novidade${ids.size===1?"":"s"}?\n\nElas não serão oferecidas de novo, nem depois de recarregar.`)) break;
        carregando = true; render();
        await salvarNoServidor(()=> dispensarNovidades([...ids]));
      } else {
        const temasSel = novidades.temas.filter(t=>ids.has(t.id));
        const itensSel = novidades.itens.filter(n=>ids.has(n.item.id));
        const matsSel  = (novidades.materiais||[]).filter(n=>ids.has(n.mat.id));
        carregando = true; render();
        await salvarNoServidor(()=> adicionarNovidades(temasSel, itensSel, matsSel));
      }
      state = await load();
      carregando = false;
      /* Sem novidade restante não há tela para ficar: volta para a trilha. */
      go(contarNovidades() ? "novidades" : "home");
      render();
      break;
    }
  }
});

document.addEventListener("submit", async e=>{
  /* -------------------------- Chat -------------------------- */
  const fc = e.target.closest("[data-form-chat]");
  if(fc){
    e.preventDefault();
    const aba = state.abas.find(a=>a.id===fc.dataset.formChat);
    const texto = fc.texto.value.trim().slice(0,2000);
    if(!aba || !texto || chatPensando) return;

    chatMsgs.push({ role:"user", content: texto });
    salvarChat(aba.id);
    chatPensando = true; render();

    try{
      /* Só as últimas mensagens sobem: o contexto pesado (itens, notas,
         progresso) a função monta do banco, e repetir tudo a cada turno
         só encareceria a conversa. */
      const resposta = await iaStream({
        acao: "chat", temaId: aba.dbId,
        mensagens: chatMsgs.slice(-12)
      }, parcial=>{
        chatPensando = false;
        const ult = chatMsgs[chatMsgs.length-1];
        if(ult && ult.role === "assistant") ult.content = parcial;
        else chatMsgs.push({ role:"assistant", content: parcial });
        render();
      });
      if(!resposta) chatMsgs.push({ role:"assistant", content:"(sem resposta)" });
    }catch(err){
      chatMsgs.push({ role:"assistant", content:"Não consegui responder: " + err.message });
    }
    chatPensando = false; salvarChat(aba.id); render();
    requestAnimationFrame(()=>{ const i=document.querySelector("[data-form-chat] input"); if(i) i.focus(); });
    return;
  }

  /* ------------------------ Projeto ------------------------ */
  const fp = e.target.closest("[data-form-proj]");
  if(fp){
    e.preventDefault();
    const p = acharProjeto(fp.dataset.formProj);
    if(!p){ editandoProj=null; render(); return; }
    /* Cortes nos limites do CHECK do banco (80 / 300). */
    const nome      = (fp.nome.value.trim() || "(sem nome)").slice(0,80);
    const descricao = fp.descricao.value.trim().slice(0,300);
    const eraNovo   = Boolean(p.novo);

    p.nome = nome; p.descricao = descricao; delete p.novo;
    editandoProj = null; render();

    /* Id do cliente: é o que permite criar offline e entrar na fila. */
    const novoP = eraNovo ? novoId() : null;
    if(eraNovo){ p.id = novoP; render(); }

    await salvarNoServidor(async ()=>{
      if(eraNovo){
        await sbFetch("projetos", {
          method:"POST", headers:{ "Prefer":"return=minimal" },
          body: JSON.stringify({ id:novoP, nome, descricao, ordem:p.ordem })
        });
      } else {
        await sbFetch(`projetos?id=eq.${p.id}`, {
          method:"PATCH", body: JSON.stringify({ nome, descricao })
        });
      }
    });
    return;
  }

  /* ------------------------- Tarefa ------------------------- */
  const ftar = e.target.closest("[data-form-tarefa]");
  if(ftar){
    e.preventDefault();
    const t = acharTarefa(ftar.dataset.formTarefa);
    if(!t){ editandoTarefa=null; render(); return; }
    /* Cortes nos limites do CHECK do banco (120 / 500). */
    const titulo  = (ftar.titulo.value.trim() || "(sem título)").slice(0,120);
    const detalhe = ftar.detalhe.value.trim().slice(0,500);
    /* ⚠ `|| null`, e não o valor cru: <input type="date"> em branco devolve
       string VAZIA, e "" numa coluna `date` do Postgres é
       "invalid input syntax for type date" — um 400 no meio de um salvamento
       que parecia trivial. */
    const prazo   = ftar.prazo.value || null;
    const eraNovo = Boolean(t.novo);

    t.titulo = titulo; t.detalhe = detalhe; t.prazo = prazo; delete t.novo;
    editandoTarefa = null; render();

    const novoT = eraNovo ? novoId() : null;
    if(eraNovo){ t.id = novoT; render(); }

    await salvarNoServidor(async ()=>{
      if(eraNovo){
        await sbFetch("tarefas", {
          method:"POST", headers:{ "Prefer":"return=minimal" },
          body: JSON.stringify({ id:novoT, projeto_id:t.projeto_id, titulo, detalhe,
                                 status:t.status, prazo, ordem:t.ordem })
        });
      } else {
        await sbFetch(`tarefas?id=eq.${t.id}`, {
          method:"PATCH", body: JSON.stringify({ titulo, detalhe, prazo })
        });
      }
    });
    return;
  }

  /* ------------------------ Material ------------------------ */
  const fmat = e.target.closest("[data-form-mat]");
  if(fmat){
    e.preventDefault();
    const f = acharMaterial(fmat.dataset.formMat);
    if(!f){ editingMat=null; render(); return; }
    /* Cortes nos limites do CHECK do banco (120 / 500 / 500). */
    const titulo = (fmat.titulo.value.trim() || "(sem título)").slice(0,120);
    const url    = fmat.url.value.trim().slice(0,500);
    /* O tipo tem CHECK no banco: mandar valor fora da lista seria erro
       do servidor, e não vale confiar no <select> para isso. */
    const tipo   = TIPOS_MAT[fmat.tipo.value] ? fmat.tipo.value : "outro";
    const nota   = fmat.nota.value.trim().slice(0,500);
    const eraNovo = Boolean(f.mat.novo);

    /* Guarda o endereço como foi digitado. Quem decide se ele vira link
       é o urlSegura() na hora de desenhar — assim um endereço estranho
       fica visível e corrigível, em vez de sumir sem explicação. */
    f.mat.titulo = titulo; f.mat.url = url; f.mat.tipo = tipo; f.mat.nota = nota;
    delete f.mat.novo;
    editingMat = null; render();

    const novoMat = eraNovo ? novoId() : null;
    if(eraNovo){ f.mat.id = novoMat; render(); }

    await salvarNoServidor(async ()=>{
      if(eraNovo){
        await sbFetch("materiais", {
          method:"POST", headers:{ "Prefer":"return=minimal" },
          body: JSON.stringify({ id:novoMat, tema_id:f.aba.dbId, titulo, url, tipo, nota, ordem:f.mat.ordem,
                                 ...(modoModelo?{user_id:null}:{}) })
        });
      } else {
        await sbFetch(`materiais?id=eq.${f.mat.id}`, {
          method:"PATCH", body: JSON.stringify({ titulo, url, tipo, nota })
        });
      }
    });
    return;
  }

  /* ------------------------- Nota ------------------------- */
  const fn = e.target.closest("[data-form-nota]");
  if(fn){
    e.preventDefault();
    const f = findItem(fn.dataset.formNota);
    if(!f){ editingNota=null; render(); return; }
    /* Corta no limite do check constraint do banco (2000). */
    const nota = fn.nota.value.trim().slice(0,2000);
    if(f.it.novo){ alert("Salve o item antes de anotar."); return; }
    f.it.nota = nota; editingNota = null; render();
    await salvarNoServidor(()=> sbFetch(`itens?id=eq.${f.it.id}`, {
      method:"PATCH", body: JSON.stringify({ nota })
    }));
    return;
  }

  /* ------------------------- Tema ------------------------- */
  const ft = e.target.closest("[data-form-tema]");
  if(ft){
    e.preventDefault();
    const aba = state.abas.find(a=>a.id===ft.dataset.formTema); if(!aba) return;
    const nome   = (ft.nome.value.trim() || "Sem nome").slice(0,60);
    const emoji  = (ft.emoji.value.trim() || "📘").slice(0,8);
    const resumo = ft.resumo.value.trim().slice(0,200);
    const eraNovo = Boolean(aba.novo);

    aba.nome = nome; aba.emoji = emoji; aba.resumo = resumo;
    editingAba = null;

    if(eraNovo){
      /* Troca o id temporário pelo slug definitivo ANTES de navegar, senão a
         rota aponta para um tema que não existe mais e o app cai na home. */
      const slug = slugUnico(nome, aba.id);
      delete aba.novo; aba.id = slug;
      go(slug);
      /* O id nasce aqui, não no banco: assim o tema já tem identidade antes
         de a requisição sair, e criar sem rede continua funcionando. */
      const novo = novoId();
      aba.dbId = novo;
      await salvarNoServidor(async ()=>{
        await sbFetch("temas", {
          method:"POST", headers:{ "Prefer":"return=minimal" },
          /* user_id: null explícito no modo modelo. A coluna tem
             "default auth.uid()", então omitir carimbaria o admin como
             dono e a linha viraria a cópia dele em vez do modelo. */
          body: JSON.stringify({ id: novo, slug, nome, emoji, resumo, ordem: aba.ordem, ...(modoModelo?{user_id:null}:{}) })
        });
      });
    } else {
      render();
      await salvarNoServidor(()=> sbFetch(`temas?id=eq.${aba.dbId}`, {
        method:"PATCH", body: JSON.stringify({ nome, emoji, resumo })
      }));
    }
    return;
  }

  /* ------------------------- Mural ------------------------- */
  const fm = e.target.closest("[data-form-msg]");
  if(fm){
    e.preventDefault();
    if(offline){ alert("O mural precisa do banco. Em modo local não dá para enviar."); return; }
    if(!logado()){ alert("Entre com o Google para deixar um recado."); return; }
    const autor = (identidadeAutor() || "Anônimo").slice(0,40);
    const texto = fm.texto.value.trim().slice(0,500);
    if(!texto) return;
    fm.texto.value = "";
    try{
      const id = novoId();
      const criada_em = new Date().toISOString();
      await sbFetch("mensagens", {
        method:"POST", headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ id, autor, texto, user_id: sessao.user.id, criada_em })
      });
      /* A linha é montada aqui em vez de vir do servidor: assim o recado
         aparece na hora mesmo quando ele foi só para a fila. */
      mensagens.unshift({ id, autor, texto, criada_em });
      render();
    }catch(err){
      console.error(err);
      alert("Não consegui enviar o recado.\n\n"+err.message);
    }
    return;
  }

  /* ------------------------- Item ------------------------- */
  const form = e.target.closest("[data-form]"); if(!form) return;
  e.preventDefault();
  const f = findItem(form.dataset.form);
  if(!f){ editingId=null; render(); return; }

  /* Corta nos limites do check constraint do banco (200 / 300). */
  const texto   = (form.texto.value.trim() || "(sem título)").slice(0,200);
  const detalhe = form.detalhe.value.trim().slice(0,300);
  const eraNovo = Boolean(f.it.novo);

  f.it.texto = texto; f.it.detalhe = detalhe; delete f.it.novo;
  editingId = null; render();

  /* Mesmo motivo do tema: o uuid é do cliente, então o item existe de
     verdade mesmo que a requisição só suba amanhã. */
  const novoIt = eraNovo ? novoId() : null;
  if(eraNovo){ f.it.id = novoIt; render(); }

  await salvarNoServidor(async ()=>{
    if(eraNovo){
      await sbFetch("itens", {
        method:"POST",
        headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ id:novoIt, tema_id:f.aba.dbId, texto, detalhe, ordem:f.it.ordem, ...(modoModelo?{user_id:null}:{}) })
      });
    } else {
      await sbFetch(`itens?id=eq.${f.it.id}`, {
        method:"PATCH", body: JSON.stringify({ texto, detalhe })
      });
    }
  });
});

function focusEdit(){ requestAnimationFrame(()=>{ const i=document.querySelector(".edit-form input[name='texto']"); if(i){ i.focus(); i.select(); } }); }
function focusTema(){ requestAnimationFrame(()=>{ const i=document.querySelector("[data-form-tema] input[name='nome']"); if(i){ i.focus(); i.select(); } }); }
/* Sem select(): diferente do texto do item, uma nota já escrita costuma ser
   continuada, não substituída — selecionar tudo faria a próxima tecla apagá-la. */
function focusNota(){ requestAnimationFrame(()=>{ const t=document.querySelector(".nota-form textarea"); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }); }
function focusMat(){ requestAnimationFrame(()=>{ const i=document.querySelector("[data-form-mat] input[name='titulo']"); if(i){ i.focus(); i.select(); } }); }

function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="data.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}
$("#fileIn").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let d;
    try{ d = JSON.parse(r.result); if(!d || !Array.isArray(d.abas)) throw new Error("formato"); }
    catch(err){
      alert("Arquivo inválido. Selecione um data.json exportado por este app.");
      e.target.value=""; return;
    }

    if(offline){   // sem banco, importar é o comportamento antigo: só local
      state = aplicarProgresso(d); editingId=null; editingAba=null; persist(); render();
      e.target.value=""; return;
    }

    const nItens = d.abas.reduce((n,a)=>n+((a.itens&&a.itens.length)||0), 0);
    const ok = confirm(
      `Substituir a trilha inteira por ${d.abas.length} temas e ${nItens} itens?\n\n`+
      /* O Exportar serializa o `state`, que não tem os arquivados — então o
         Importar apaga um conteúdo que o backup não guardou. Dizer isso é
         mais barato que descobrir depois. */
      `Isso APAGA a sua trilha atual (só a sua)${temArquivo?", inclusive o que você arquivou":""} e põe esta no lugar.\n`+
      `Se quiser poder voltar atrás, cancele e clique em Exportar antes.`
    );
    if(!ok){ e.target.value=""; return; }

    try{
      carregando = true; render();
      await substituirTrilha(d);
      state = await load();
    }catch(err){
      console.error(err);
      alert("Falha ao substituir a trilha.\n\n"+err.message);
      state = await load();
    }
    carregando = false; editingId=null; editingAba=null; render();
    e.target.value="";
  };
  r.readAsText(file);
});

function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); }
function toggleTheme(){ const next = curTheme()==="dark"?"light":"dark"; try{ localStorage.setItem(THEME_KEY, next); }catch(e){} applyTheme(next); render(); }

/* ============================ Init ============================ */
/* Service worker só em origem segura. Sob file:// ele nem existe, e o
   duplo clique no arquivo precisa continuar funcionando — registrar ali
   só encheria o console de erro. localhost entra junto porque o navegador
   o trata como seguro, e é assim que dá para testar o PWA antes do push. */
if("serviceWorker" in navigator &&
   (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(e=>console.error("SW:", e));
  });
}

applyTheme((()=>{ try{ return localStorage.getItem(THEME_KEY)||"dark"; }catch(e){ return "dark"; } })());
render();   // pinta o "carregando" antes do primeiro fetch

(async ()=>{
  if(sbClient){
    /* getSession() já espera o SDK trocar o ?code= do Google por uma sessão. */
    try{ const { data } = await sbClient.auth.getSession(); sessao = data && data.session || null; }
    catch(e){ console.error("Sessão:", e); }

    /* Restaura a rota de onde a pessoa saiu para logar. */
    try{
      const voltar = sessionStorage.getItem(VOLTAR_KEY);
      if(voltar){ sessionStorage.removeItem(VOLTAR_KEY); if(voltar && voltar!==location.hash) location.hash = voltar; }
    }catch(e){}

    sbClient.auth.onAuthStateChange((_evt, s)=>{
      const antes = sessao && sessao.user ? sessao.user.id : null;
      const agora = s && s.user ? s.user.id : null;
      sessao = s;
      /* Só recarrega quando o usuário realmente muda — renovação de token
         dispara este evento o tempo todo e não deveria repintar a tela. */
      if(authPronto && antes !== agora) recarregar();
    });
  }

  state = await load();
  carregando = false;
  /* Sem estas linhas, abrir o app instalado direto num #historico ou num
     #projeto/<id> salvo na tela inicial mostraria a tela vazia até navegar
     para outro lugar e voltar — e é o caso normal num PWA, não o excepcional. */
  const r0 = route();
  if(r0==="mural") await carregarMensagens();
  else if(r0==="historico") await carregarHistorico();
  else if(r0==="projetos") await carregarProjetos();
  else if(r0.startsWith("projeto/")) await carregarProjeto(r0.slice(8));
  render();
  ajustarMural();
  authPronto = true;
})();
</script>
