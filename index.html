<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha de Estudos — IA & Dev</title>

<!-- PWA. Os caminhos são relativos (./) porque o site vive em
     /Estudo-Geral/, não na raiz do domínio: com "/" o manifest e o
     service worker apontariam para fora do projeto. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF8A5B">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ============ Tokens ============ */
:root{
  --font-display: Georgia, "Times New Roman", serif;
  --font-body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;

  --bg:#0E1518; --bg-2:#0B1113;
  --panel:#152025; --panel-2:#1A272D;
  --line:#26383F; --line-soft:#1E2E34;
  --ink:#EAF1F2; --ink-dim:#B7C6CB; --muted:#7E949C;
  --accent:#FF8A5B; --accent-ink:#1a0f0a;
  --done:#57D2B0; --done-ink:#06231d;
  --gold:#F2C14E;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --radius:14px;
}
:root[data-theme="light"]{
  --bg:#EDF2F1; --bg-2:#E4ECEA;
  --panel:#FFFFFF; --panel-2:#F5F8F7;
  --line:#D6E1DE; --line-soft:#E5EDEB;
  --ink:#12242A; --ink-dim:#33474E; --muted:#5D7178;
  --accent:#DF5F31; --accent-ink:#fff;
  --done:#12977A; --done-ink:#fff;
  --gold:#B9852A;
  --shadow: 0 10px 30px rgba(20,40,45,.10);
}

*{box-sizing:border-box}
html,body{margin:0; overflow-x:hidden}
body{
  min-height:100vh;
  background:
    radial-gradient(1100px 520px at 50% -8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}

/* ============ Container central ============ */
.wrap{max-width:860px; margin:0 auto; padding:22px 22px 80px; width:100%}

/* top bar (todas as telas) */
.bar{display:flex; align-items:center; gap:12px; margin-bottom:22px}
.bar .spacer{flex:1}
.brandmini{font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.ghost{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  background:var(--panel); color:var(--ink-dim); border:1px solid var(--line);
  padding:8px 13px; border-radius:10px; font-size:13px; transition:.15s}
.ghost:hover{color:var(--ink); border-color:var(--accent)}
.ghost.back{font-weight:600; color:var(--ink)}

/* ============ Home ============ */
.home-head{text-align:center; margin:14px 0 26px}
.home-head .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent)}
.home-head h1{font-family:var(--font-display); font-weight:600; font-size:38px; line-height:1.08; letter-spacing:-.02em; margin:12px 0 8px}
.home-head p{margin:0 auto; color:var(--muted); max-width:52ch}

.overall-card{display:flex; align-items:center; gap:20px; justify-content:center;
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:20px 24px; box-shadow:var(--shadow); margin-bottom:26px; flex-wrap:wrap}
.big-ring{--v:0; width:90px; height:90px; border-radius:50%; flex:none;
  background:conic-gradient(var(--accent) calc(var(--v)*1%), var(--line) 0); display:grid; place-items:center; transition:background .6s}
.big-ring > span{width:70px; height:70px; border-radius:50%; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center}
.big-ring b{font-family:var(--font-mono); font-size:20px; line-height:1}
.big-ring small{color:var(--muted); font-size:9px; letter-spacing:.14em; text-transform:uppercase; margin-top:2px}
.overall-txt{min-width:180px}
.overall-txt h3{margin:0 0 4px; font-family:var(--font-display); font-weight:600; font-size:18px}
.overall-txt p{margin:0 0 10px; color:var(--muted); font-size:13px}
.overall-txt .track{height:8px; border-radius:99px; background:var(--line); overflow:hidden; max-width:320px}
.overall-txt .track > i{display:block; height:100%; background:var(--accent); transition:width .6s cubic-bezier(.2,.7,.2,1)}

.section-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:26px 4px 10px}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(232px,1fr)); gap:12px}
.card{display:flex; flex-direction:column; text-align:left; cursor:pointer; gap:0;
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 16px 15px;
  transition:transform .14s, border-color .14s, background .14s; min-height:96px}
.card:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
.card.feature{background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, var(--panel)), var(--panel))}
.card.done-all{border-color:color-mix(in srgb, var(--done) 45%, var(--line))}
.card .c-top{display:flex; align-items:center; gap:9px; margin-bottom:auto}
.card .c-num{font-family:var(--font-mono); font-size:12px; color:var(--muted)}
.card.done-all .c-num{color:var(--done)}
.card .c-emoji{font-size:20px}
.card .c-name{font-weight:600; font-size:15px; margin:10px 0 3px; line-height:1.2}
.card .c-sub{color:var(--muted); font-size:12.5px; margin:0}
.card .c-bar{height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:12px}
.card .c-bar > i{display:block; height:100%; background:var(--accent); transition:width .5s}
.card.done-all .c-bar > i{background:var(--done)}
.card .c-meta{display:flex; justify-content:space-between; align-items:center; margin-top:8px}
.card .c-count{font-family:var(--font-mono); font-size:11px; color:var(--muted)}
.card .c-go{font-size:16px; color:var(--accent); opacity:0; transition:.14s}
.card:hover .c-go{opacity:1}
.badge{font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent-ink);
  background:var(--accent); border-radius:99px; padding:2px 9px}

/* ============ Section header ============ */
.sec-head{margin-bottom:20px}
.sec-head .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent)}
.sec-head h2{font-family:var(--font-display); font-weight:600; font-size:30px; letter-spacing:-.02em; margin:8px 0 6px; overflow-wrap:break-word}
.sec-head p{margin:0; color:var(--muted); max-width:62ch}
.sec-head .prog-inline{display:flex; align-items:center; gap:12px; margin-top:14px}
.sec-head .track{flex:1; max-width:340px; height:8px; border-radius:99px; background:var(--line); overflow:hidden}
.sec-head .track > i{display:block; height:100%; background:var(--accent); width:0; transition:width .5s cubic-bezier(.2,.7,.2,1)}
.sec-head.all-done .track > i{background:var(--done)}
.sec-head .pct{font-family:var(--font-mono); font-size:13px; color:var(--ink-dim)}

/* ============ Items ============ */
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.item{display:grid; grid-template-columns:26px 1fr auto; align-items:start; gap:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px; transition:border-color .15s, background .15s}
.item:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.item.is-done{background:var(--panel-2); border-color:var(--line-soft)}
.check{margin-top:1px; width:24px; height:24px; border-radius:7px; cursor:pointer;
  border:2px solid var(--muted); background:transparent; color:transparent;
  display:grid; place-items:center; font-size:14px; transition:.15s; padding:0}
.check:hover{border-color:var(--accent)}
.item.is-done .check{background:var(--done); border-color:var(--done); color:var(--done-ink)}
.item-body{min-width:0}
.item-text{margin:0; font-size:15px; font-weight:600; color:var(--ink); overflow-wrap:break-word}
.item.is-done .item-text{text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--done) 70%, transparent); color:var(--ink-dim)}
.item-detail{margin:4px 0 0; font-size:12.5px; color:var(--muted); overflow-wrap:break-word}
.pill-done{display:inline-flex; align-items:center; gap:5px; margin-top:8px;
  font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:lowercase;
  color:var(--done); background:color-mix(in srgb,var(--done) 15%, transparent);
  border:1px solid color-mix(in srgb,var(--done) 40%, transparent); border-radius:99px; padding:3px 9px}
.chip{display:inline-flex; align-items:center; gap:5px; margin-top:8px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.03em;
  color:var(--ink-dim); background:var(--panel-2);
  border:1px solid var(--line); border-radius:99px; padding:3px 10px}
.item-actions{display:flex; gap:4px}
.mini{background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer;
  border-radius:8px; padding:5px 8px; font-size:12px; transition:.15s; white-space:nowrap}
.mini:hover{color:var(--ink); background:var(--panel-2); border-color:var(--line)}
.mini.danger:hover{color:#ff7a7a; border-color:color-mix(in srgb,#ff7a7a 40%,var(--line))}

.edit-form{grid-column:1 / -1; display:flex; flex-direction:column; gap:8px}
.edit-form input{font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%}
.edit-form input:focus{outline:none; border-color:var(--accent)}
.edit-form input.detail{font-size:12.5px; color:var(--ink-dim)}
.edit-form .row{display:flex; gap:8px; justify-content:flex-end}
.btn{cursor:pointer; border-radius:9px; padding:8px 14px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-dim)}
.btn:hover{color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.add-item{margin-top:12px; width:100%; border:1.5px dashed var(--line); background:transparent; color:var(--muted);
  border-radius:12px; padding:12px; cursor:pointer; font-size:13px; font-weight:600; transition:.15s}
.add-item:hover{border-color:var(--accent); color:var(--ink)}

/* ============ Resumo ============ */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.rcard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px}
.rcard h4{margin:0 0 14px; font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent)}
.rcard.wide{grid-column:1 / -1}
.rcard-hint{margin:0 0 14px; font-size:13px; color:var(--muted)}

/* ---- Sequência ---- */
.streak{display:flex; align-items:baseline; gap:10px}
.streak b{font-size:44px; line-height:1; color:var(--muted)}
.streak.on b{color:var(--done)}
.streak span{font-size:13.5px; color:var(--ink-dim)}
.streak-sub{display:flex; gap:22px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft)}
.streak-sub div{display:flex; flex-direction:column; gap:2px}
.streak-sub b{font-size:16px; color:var(--ink)}
.streak-sub span{font-size:11.5px; color:var(--muted)}

/* ---- Mapa de atividade ---- */
/* Colunas = semanas, 7 linhas = domingo a sábado. O grid-auto-flow:column é o
   que faz 84 casas em sequência virarem 12 semanas sem nenhum cálculo no JS. */
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px}
.heat .hc{aspect-ratio:1; border-radius:3px; background:var(--line-soft)}
.heat .hc.n1{background:color-mix(in srgb, var(--done) 35%, var(--line-soft))}
.heat .hc.n2{background:color-mix(in srgb, var(--done) 65%, var(--line-soft))}
.heat .hc.n3{background:var(--done)}
.heat .hc.fut{opacity:.3}
.heat-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  margin-top:12px; font-size:11.5px; color:var(--muted)}
.heat-leg{display:inline-flex; align-items:center; gap:3px}
.heat-leg .hc{width:10px; height:10px; border-radius:2px; background:var(--line-soft)}
.heat-leg .hc.n1{background:color-mix(in srgb, var(--done) 35%, var(--line-soft))}
.heat-leg .hc.n2{background:color-mix(in srgb, var(--done) 65%, var(--line-soft))}
.heat-leg .hc.n3{background:var(--done)}
.tprog{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
.tprog:last-child{border-bottom:0}
.tprog .tp-emoji{font-size:16px; width:22px; text-align:center}
.tprog .tp-name{flex:1; font-size:13.5px; font-weight:600; cursor:pointer; overflow-wrap:break-word}
.tprog .tp-name:hover{color:var(--accent)}
.tprog .tp-bar{width:96px; height:6px; border-radius:99px; background:var(--line); overflow:hidden; flex:none}
.tprog .tp-bar > i{display:block; height:100%; background:var(--accent); width:0; transition:width .5s}
.tprog.full .tp-bar > i{background:var(--done)}
.tprog .tp-num{font-family:var(--font-mono); font-size:11px; color:var(--muted); width:38px; text-align:right; flex:none}
.pend{list-style:none; margin:0; padding:0}
.pend li{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px}
.pend li:last-child{border-bottom:0}
.pend .p-tag{font-family:var(--font-mono); font-size:10px; color:var(--accent); white-space:nowrap}
.cron{width:100%; border-collapse:collapse; font-size:13px}
.cron th,.cron td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft)}
.cron th{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.cron td.wk{font-family:var(--font-mono); color:var(--accent); white-space:nowrap}

.foot{margin-top:26px; color:var(--muted); font-size:12px; text-align:center}
.foot code{font-family:var(--font-mono); background:var(--panel); padding:2px 6px; border-radius:6px; border:1px solid var(--line)}
.empty-state{text-align:center; padding:40px 20px; color:var(--muted)}
.empty-state .big{font-size:40px; margin-bottom:10px}

/* ============ Conta ============ */
.bar{flex-wrap:wrap}
.conta{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-dim); max-width:200px; min-width:0}
.conta img{width:24px; height:24px; border-radius:50%; flex:none; background:var(--panel-2)}
.conta b{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.convite{background:var(--panel); border:1.5px dashed var(--line); border-radius:var(--radius);
  padding:18px 20px; text-align:center; margin-bottom:22px}
.convite p{margin:0 0 12px; color:var(--muted); font-size:13.5px; max-width:52ch; margin-inline:auto}
.convite .btn{display:inline-flex; align-items:center; gap:8px}
.msg-como{flex:1; align-self:center; font-size:12px; color:var(--muted); text-align:left;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ Quadro de projeto ============ */
/* Uma coluna por vez em qualquer largura, escolhida pelos chips; o "tudo"
   empilha as três, e só a partir de 860px elas viram três colunas lado a lado.
   Zero leitura de viewport no JS e um único caminho de renderização — que é
   também o que mantém a promessa de nada de arrastar-soltar.

   Nenhuma regra nova no @media (max-width:640px), e isso é resultado de
   decisão: linha de projeto e de tarefa são .item com .item-body e
   .item-actions, então herdam as duas regras que consertaram o esmagamento de
   2026-07-29 — é por isso que "← a fazer" e "feito →", os botões mais largos
   do app depois dos da IA, cabem no celular. */
.quadro{display:grid; gap:12px}
@media (min-width:860px){ .quadro.tudo{grid-template-columns:repeat(3,1fr); align-items:start} }
.quadro .section-label{margin-top:0}
.tar-mark{width:26px; text-align:center; font-size:15px; line-height:1.6; color:var(--muted)}
.item.feita .item-text{text-decoration:line-through; color:var(--muted)}
.chip.prazo.venceu{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%, var(--line))}
.col-vazia{list-style:none; color:var(--muted); font-size:12.5px; padding:10px 4px}

/* ============ Gestão de temas ============ */
.tema-actions{display:flex; gap:4px; margin-top:14px; flex-wrap:wrap}
.mini[disabled]{opacity:.3; cursor:default}
.mini[disabled]:hover{color:var(--muted); background:transparent; border-color:transparent}
.row-tema{display:flex; gap:8px}
.row-tema input[name="emoji"]{width:64px; text-align:center; font-size:18px; flex:none}
.card.novo{border-style:dashed; align-items:center; justify-content:center; text-align:center}
.card.novo .c-name{margin-top:0}

/* ============ Mural ============ */
.msg-form{margin-bottom:22px}
.msgs{gap:8px}
.msg{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; list-style:none}
.msg-head{display:flex; align-items:baseline; gap:10px; margin-bottom:5px}
.msg-head b{font-size:13.5px; color:var(--accent)}
.msg-head time{font-family:var(--font-mono); font-size:10.5px; color:var(--muted)}
.msg-body{margin:0; font-size:14px; color:var(--ink); overflow-wrap:break-word; white-space:pre-wrap}

/* ============ Faixas (modelo oficial / novidades) ============ */
.faixa{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:12px max(22px, calc((100% - 860px) / 2)); font-size:13.5px; color:var(--ink)}
.faixa b{color:var(--ink)}
.faixa.modelo{background:color-mix(in srgb, var(--gold) 16%, var(--panel)); border-bottom:1px solid color-mix(in srgb, var(--gold) 45%, var(--line))}
.faixa.nov{background:color-mix(in srgb, var(--accent) 12%, var(--panel)); border-bottom:1px solid color-mix(in srgb, var(--accent) 40%, var(--line))}
.faixa.rede{background:var(--panel-2); border-bottom:1px solid var(--line); color:var(--ink-dim)}
.faixa .btn{flex:none}

/* ============ Anotações ============ */
.item-nota{margin:9px 0 0; padding:9px 12px; font-size:13px; color:var(--ink-dim);
  background:var(--panel-2); border-left:3px solid color-mix(in srgb, var(--gold) 70%, transparent);
  border-radius:0 8px 8px 0; white-space:pre-wrap; overflow-wrap:break-word}
.nota-form{margin-top:10px}
.nota-form textarea{font-family:var(--font-body); font-size:13.5px; line-height:1.5; resize:vertical; min-height:88px;
  background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:10px 12px; width:100%}
.nota-form textarea:focus{outline:none; border-color:var(--accent)}
.mini.com-nota{color:var(--gold)}
.check-vazio{width:24px; height:24px}   /* segura a coluna do grid no modo modelo */

/* ============ IA ============ */
.ia-acoes{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:14px 0 4px}
.ia-resta{font-family:var(--font-mono); font-size:10.5px; color:var(--muted)}
.mini.ia{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 30%, var(--line))}
.mini.ia:hover{color:var(--gold); background:color-mix(in srgb,var(--gold) 12%, transparent); border-color:var(--gold)}
.ia-caixa{margin-top:10px; padding:12px 14px; border-radius:10px;
  background:var(--panel-2); border-left:3px solid color-mix(in srgb,var(--gold) 70%, transparent)}
.ia-texto{margin:0 0 10px; font-size:13.5px; line-height:1.6; color:var(--ink-dim); white-space:pre-wrap; overflow-wrap:break-word}
.ia-texto.aviso{color:var(--gold); font-size:12.5px}
.ia-texto.pensando{color:var(--muted); font-style:italic}
.ia-caixa .row{display:flex; gap:8px; justify-content:flex-end}
.ia-painel{margin:16px 0 8px; padding:16px; border-radius:16px;
  background:var(--panel); border:1px solid color-mix(in srgb,var(--gold) 35%, var(--line))}

/* ---- Chat ---- */
.chat-bolha{position:fixed; right:18px; bottom:18px; z-index:20; width:52px; height:52px; border-radius:50%;
  font-size:22px; cursor:pointer; border:1px solid var(--line); background:var(--panel); box-shadow:var(--shadow)}
.chat-bolha:hover{border-color:var(--gold)}
/* As duas linhas de max-height não são redundância. No celular, `vh` é
   medido contra o viewport MAIOR — com a barra do navegador escondida —
   então parte do painel fica embaixo da barra e some. `dvh` acompanha a
   barra aparecendo e desaparecendo; a linha com `vh` fica antes como
   reserva para navegador que não conhece `dvh`. */
.chat-painel{position:fixed; right:14px; bottom:14px; z-index:20; width:min(420px, calc(100vw - 28px));

  max-height:min(70dvh, 560px); display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.chat-topo{display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:12.5px;
  color:var(--ink-dim); border-bottom:1px solid var(--line-soft)}
.chat-corpo{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px}
.chat-msg{display:flex; flex-direction:column; gap:3px}
.chat-msg .chat-quem{font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.chat-msg p{margin:0; font-size:13.5px; line-height:1.55; white-space:pre-wrap; overflow-wrap:break-word}
.chat-msg.user p{color:var(--ink)}
.chat-msg.assistant p{color:var(--ink-dim)}
.chat-msg p.pensando{color:var(--muted); font-style:italic}
.chat-form{padding:10px 12px; border-top:1px solid var(--line-soft)}

/* ---- Revisão ---- */
.cartao{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px}
.cartao-pergunta{margin:0; font-size:17px; font-weight:600; color:var(--ink); line-height:1.45}
.cartao-resposta{margin:16px 0 0; padding-top:16px; border-top:1px solid var(--line-soft);
  font-size:14px; line-height:1.6; color:var(--ink-dim); white-space:pre-wrap}

/* ============ Materiais ============ */
.mat-sec{margin-top:28px}
.item.mat{align-items:center}
.mat-tipo{font-size:17px; line-height:1; text-align:center; width:26px}
.item.mat .item-text a{color:var(--ink); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--accent) 50%, transparent)}
.item.mat .item-text a:hover{color:var(--accent); border-bottom-color:var(--accent)}
.item-detail.perigo{color:var(--gold)}
.row-mat{display:flex; gap:8px}
.row-mat select{flex:none; width:132px; font-family:inherit; font-size:13px; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:9px 8px}
.row-mat select:focus{outline:none; border-color:var(--accent)}
.row-mat input{flex:1; min-width:0}
.mat-filtros{gap:6px; flex-wrap:wrap}
.mat-filtros .mini{border-color:var(--line)}
.mat-filtros .mini.on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}

/* ============ Novidades ============ */
.nov-item{grid-template-columns:22px 1fr}
.nov-check{width:18px; height:18px; margin-top:3px; accent-color:var(--accent); cursor:pointer}
.nov-item .item-text{cursor:pointer; display:block}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

@media (max-width:640px){
  .wrap{padding:16px 15px 60px}
  .home-head h1{font-size:30px}
  .grid-2{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}

  /* ⚠ Aqui morava o pior defeito de leitura do app. O texto da IA e a
     anotação renderizam dentro do .item-body, que é a coluna 1fr do
     .item. A terceira coluna é `auto` e os .mini têm white-space:nowrap,
     então ela NÃO encolhe; e .item-body{min-width:0} deixa o 1fr ser
     esmagado até quase zero. Num aparelho de 360px: 330 de conteúdo − 32
     de padding − 26 do ✓ − 28 dos gaps − ~198 dos quatro botões ≈ 46px
     para o texto. No desktop sobra folga, então o defeito é invisível
     para quem desenvolve — não quebra nada, só entrega ao texto o que
     restou. Duas colunas no celular, e as ações descem para uma linha
     própria de largura inteira: o texto vai de ~46px para ~244px. */
  .item{grid-template-columns:26px 1fr}
  .nov-item{grid-template-columns:22px 1fr}   /* preserva o que já era */
  .item-actions{grid-column:1 / -1; justify-content:flex-end; flex-wrap:wrap}
  /* O <span></span> que acoesItem() devolve para quem não pode editar é
     filho do grid: sem isto ele ocupa a 2ª linha e o gap abre 14px de
     sobra embaixo do item. Só o último — o .check-vazio do modo modelo
     também é um span vazio, e esse tem que continuar ocupando a coluna. */
  .item > span:empty:last-child{display:none}

  /* 13.5px é tamanho de rodapé, não de leitura longa em tela pequena. */
  .ia-texto, .chat-msg p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

async function sbFetch(path, opts={}){
  const metodo = (opts.method || "GET").toUpperCase();
  let r;
  try{
    r = await fetch(`${SB.url}/rest/v1/${path}`, { ...opts, headers: cabecalhosSb(opts.headers) });
  }catch(e){
    /* fetch só rejeita quando a requisição NÃO CHEGOU (sem rede, DNS, avião).
       Resposta de erro do servidor não passa por aqui — vem no r.ok abaixo.
       A diferença é o que decide o que entra na fila: repetir um 403 mil
       vezes não conserta nada, repetir um POST perdido conserta tudo. */
    if(metodo !== "GET"){ enfileirar(path, opts, metodo); return null; }
    throw e;

  if(!r.ok){
    const err = new Error(`${r.status} — ${await r.text()}`);

  const corpo = await r.text();

   rajada num minuto, então a trava tem que ser aqui.

   E o motivo de ela morar no chamarIA() e não em cada botão: o chat já se
   protegia com o chatPensando, mas o ✨ de explicar não — clicar três
   vezes disparava três requisições concorrentes. Uma trava por botão
   deixaria sempre um de fora; a porta única não deixa. */
const IA_ESPACO_MS = 4000;
let iaOcupada = false, iaProximaEm = 0;
function liberarIA(){ iaOcupada = false; iaProximaEm = Date.now() + IA_ESPACO_MS; }

async function chamarIA(corpo, comoTexto){
  if(!logado()) throw new Error("Entre com a sua conta para usar a IA.");
  /* Sem o cabeçalho "apikey" de propósito: a Edge Function autentica pelo
     Authorization, e cada cabeçalho a mais é um a mais que precisa estar
     autorizado no preflight — foi exatamente o que quebrou na primeira
     tentativa, e o sintoma é o app parecer morto sem erro nenhum no
     servidor, porque o pedido nem chega a sair. */
  /* O "ping" fica fora da trava: ele não chega ao Gemini, não gasta cota e
     roda em toda carga — travá-lo atrasaria a abertura do app por nada. */
  const ehPing = corpo && corpo.acao === "ping";
  if(!ehPing){
    if(iaOcupada) throw new Error("A IA ainda está respondendo. Espere ela terminar.");
    const falta = Math.ceil((iaProximaEm - Date.now())/1000);
    if(falta > 0) throw new Error(`Espere ${falta} segundo${falta>1?"s":""} antes de pedir outra coisa à IA.`);
    iaOcupada = true;
  }
  try{
    const r = await fetch(`${SB.url}/functions/v1/ia`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${sessao.access_token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(corpo)
    });
    if(!r.ok){
      let msg = `${r.status}`;
      try{ const j = await r.json(); if(j && j.erro) msg = j.erro; }catch(e){}
      const err = new Error(msg); err.status = r.status; throw err;
    }
    /* Resposta em streaming: o servidor ainda está gerando enquanto o
       corpo é lido, então quem libera a trava é o iaStream() no fim da
       leitura — soltar aqui deixaria um segundo pedido sair no meio. */
    if(comoTexto) return r;
    const j = await r.json();
    if(!ehPing) liberarIA();
    return j;
  }catch(e){
    if(!ehPing) liberarIA();
    throw e;
  }
}

/* Descobre se a IA está disponível sem gastar um token sequer. Mesmo
   padrão de temNota/temMateriais: sem ela, os botões ✨ nem aparecem. */
async function detectarIA(){
  temIA = false;
  if(!logado() || offline) return;
  try{
    const r = await chamarIA({ acao: "ping" });
    temIA = Boolean(r && r.ok);
    iaUsadas = r.usadas || 0;
    iaLimite = r.limite || 0;
  }catch(e){ temIA = false; }   // 404 (sem deploy), 503 (sem chave), sem rede
}

/* O texto chega escrevendo, como uma conversa. Texto puro em vez de SSE:
   o cliente só concatena os pedaços, sem parser de eventos. */
async function iaStream(corpo, aoReceber){
  /* Se o chamarIA() falhar, ele já liberou a trava por conta própria — daí
     o try começar depois dele, e não em volta dele. */
  const r = await chamarIA(corpo, true);
  try{
    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let tudo = "";
    while(true){
      const { done, value } = await leitor.read();
      if(done) break;
      tudo += dec.decode(value, { stream: true });
      aoReceber(tudo);
    }
    iaUsadas++;
    return tudo;
  } finally { liberarIA(); }
}

/* -------------------- Fila de alterações -------------------- */
/* O que não chegou ao servidor fica aqui até chegar. É isto que faz uma
   alteração feita no metrô não virar pó. */
const FILA_KEY = "estudos-ia-fila-v1";
let fila = (()=>{ try{ const a=JSON.parse(localStorage.getItem(FILA_KEY)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } })();
let enviandoFila = false;

function salvarFila(){ try{ localStorage.setItem(FILA_KEY, JSON.stringify(fila)); }catch(e){} }
function pendentes(){ return fila.length; }

function enfileirar(path, opts, metodo){
  /* Só o Prefer é guardado: o crachá é remontado na hora de enviar, senão
     uma alteração de ontem subiria com um token já vencido. */
  fila.push({
    path, metodo,
    body: opts.body || null,
    prefer: (opts.headers && opts.headers.Prefer) || null,
    quando: new Date().toISOString()
  });
  salvarFila();
}

async function enviarFila(){
  if(enviandoFila || !fila.length || !sbLigado()) return false;
  enviandoFila = true;
  let enviadas = 0, recusadas = 0;
  try{
    while(fila.length){
      const t = fila[0];
      let r;
      try{
        r = await fetch(`${SB.url}/rest/v1/${t.path}`, {
          method: t.metodo,
          body: t.body || undefined,
          headers: cabecalhosSb(t.prefer ? { "Prefer": t.prefer } : null)
        });
      }catch(e){ return enviadas>0; }        // ainda sem rede: fica para a próxima
      if(!r.ok && r.status >= 500) return enviadas>0;   // servidor com soluço: idem
      if(!r.ok){
        /* 4xx é recusa definitiva (a linha já não existe, o texto é inválido).
           Insistir travaria a fila para sempre e nada mais subiria. */
        console.error("Fila: alteração recusada", t.metodo, t.path, r.status);
        recusadas++;
      } else enviadas++;
      fila.shift(); salvarFila();
    }
  } finally { enviandoFila = false; }
  if(recusadas) alert(`${recusadas} alteração${recusadas===1?"":"ões"} feita${recusadas===1?"":"s"} sem conexão não foi aceita pelo servidor e foi descartada.`);
  return enviadas>0 || recusadas>0;
}

/* Envia uma escrita ao servidor. Se falhar, avisa e recarrega do banco para a
   tela não ficar mostrando uma mentira otimista. Sem rede não é falha: o
   sbFetch já guardou na fila e devolveu como se tivesse dado certo. */
async function salvarNoServidor(op){
  if(offline){ persist(); guardarRetrato(); return true; }
  try{ await op(); guardarRetrato(); return true; }
  catch(e){
    console.error(e);
    alert("Não consegui salvar no servidor.\n\n"+e.message);
    await recarregar();
    return false;
  }
}

/* Traz temas + itens numa chamada só (embed do PostgREST) e devolve no MESMO
   formato que as telas já esperam — por isso stats/totals/viewHome não mudam. */
/* Descobre, uma vez por sessão, o que o supabase-evolucao.sql já criou.
   Duas requisições minúsculas no pior caso, uma no caso normal — e em
   troca nenhuma tela precisa adivinhar se a coluna existe. */
/* Devolve true/false quando o SERVIDOR responde, e null quando a requisição
   não chegou. É essa diferença que impede o app de anotar "esta coluna não
   existe" só porque o celular estava sem rede — o que desligava materiais,
   notas e novidades até recarregar a página. */
async function sondar(path){
  try{ await sbFetch(path); return true; }
  catch(e){ return e.status ? false : null; }
}

async function detectarColunas(){
  if(colunasDetectadas) return;
  /* A tabela de materiais é de outra migração: sondada à parte, para o
     app funcionar com uma rodada e não com a outra. */
  const mat  = await sondar("materiais?select=id&limit=1");
  const ambas = await sondar("itens?select=nota,origem_id&limit=1");
  let nota = ambas, origem = ambas;
  if(ambas === false){
    nota   = await sondar("itens?select=nota&limit=1");
    origem = await sondar("itens?select=origem_id&limit=1");
  }
  /* Arquivar precisa da coluna nas DUAS tabelas: o filtro do carregarTrilha()
     usa itens.arquivado_em (dentro do embed) E temas.arquivado_em (no topo).
     Com meia migração o filtro de cima responderia 400, o load() tentaria três
     vezes e a trilha inteira cairia para o retrato — recurso pela metade aqui
     não degrada, quebra. Por isso duas sondagens e uma flag só. */
  const arqI = await sondar("itens?select=arquivado_em&limit=1");
  const arqT = arqI === true ? await sondar("temas?select=arquivado_em&limit=1") : arqI;

  temMateriais = mat === true;
  temNota      = nota === true;
  temOrigem    = origem === true;
  temArquivo   = (arqI === true && arqT === true);
  /* Só considera o assunto resolvido se ao menos uma sondagem falou com o
     servidor. Tudo null = sem rede: tentar de novo na próxima carga. */
  colunasDetectadas = [mat, nota, origem, arqI, arqT].some(v => v !== null);
}

/* A tabela admins pode não existir ainda; nesse caso ninguém é admin e o
   botão do modo modelo simplesmente não aparece. */
async function verificarAdmin(){
  souAdmin = false;
  if(!logado()) return;
  try{
    const r = await sbFetch("admins?select=user_id&limit=1");   // o RLS já filtra para mim
    souAdmin = Array.isArray(r) && r.length > 0;

/* Sondagem PRÓPRIA, e não dentro do detectarColunas(), por uma razão concreta:
   aquela função se protege com `if(colunasDetectadas) return` — uma vez por
   sessão. Mas projetos não tem grant para o anon, então a sondagem feita
   DESLOGADO responde 401 ("false") e ficaria congelada assim; entrar com o
   Google chama recarregar() → load(), que sairia na primeira linha, e o card
   nunca apareceria. Este é o formato do verificarAdmin(), que também depende
   de quem está logado e por isso roda a cada load(). */
async function detectarProjetos(){
  temProjetos = false;
  if(!logado()) return;
  temProjetos = (await sondar("projetos?select=id&limit=1")) === true;
}

async function carregarTrilha(){
  /* Sem este filtro, quem está logado veria o modelo E a própria cópia — a
     trilha apareceria duplicada, porque as policies permitem ler os dois.
     No modo modelo o admin pede de propósito as linhas do modelo. */
  const filtro = (logado() && !modoModelo) ? `user_id=eq.${sessao.user.id}` : "user_id=is.null";
  const extraItem = (temNota?",nota":"") + (temOrigem?",origem_id":"");
  const extraTema = temOrigem ? ",origem_id" : "";
  /* Segundo embed do PostgREST: temas + itens + materiais continuam
     vindo numa requisição só. */
  const embedMat = temMateriais
    ? `,materiais(id,titulo,url,tipo,nota,ordem${temOrigem?",origem_id":""})`
    : "";
  /* Filtrar o arquivado AQUI, e não em cada tela, é o que faz stats(),
     totals(), viewAfazer(), viewResumo() e todosMateriais() continuarem
     corretos sem uma linha alterada: o que não entra no state não pode ser
     esquecido por nenhuma delas. O preço é o #historico ter de buscar o
     arquivado por conta própria — uma requisição, numa tela só.

     "arquivado_em=is.null" sem prefixo filtra TEMAS (nível de cima);
     "itens.arquivado_em=is.null" filtra o EMBED. Filtrar um embed to-many
     não some com o pai: tema com todos os itens arquivados continua vindo,
     com itens:[], e stats() devolve 0/0 — que é o certo.

     E o progresso NÃO é tocado por isto: carregarProgresso() é outra
     requisição, que não conhece itens. É por isso que a sequência de dias e
     o mapa de 12 semanas continuam contando o item arquivado. */
  const filtroArq = temArquivo ? "&arquivado_em=is.null&itens.arquivado_em=is.null" : "";
  const temas = await sbFetch(`temas?select=id,slug,nome,emoji,resumo,ordem${extraTema},itens(id,texto,detalhe,ordem${extraItem})${embedMat}&${filtro}${filtroArq}&order=ordem`);
  return {
    meta: clone(SEED.meta),
    abas: temas.map(t=>({
      id: t.slug,          // continua sendo a rota (#fundamentos-ia)
      dbId: t.id,          // uuid, usado nos PATCH/DELETE
      origemId: t.origem_id || null,   // de qual tema do modelo esta cópia nasceu
      nome: t.nome, emoji: t.emoji, resumo: t.resumo||"", ordem: t.ordem,
      itens: (t.itens||[]).sort((a,b)=>a.ordem-b.ordem).map(i=>({
        id: i.id, texto: i.texto, detalhe: i.detalhe||"", ordem: i.ordem, feito: false,
        nota: i.nota || "", origemId: i.origem_id || null
      })),
      materiais: (t.materiais||[]).sort((a,b)=>a.ordem-b.ordem).map(m=>({
        id: m.id, titulo: m.titulo, url: m.url||"", tipo: m.tipo||"outro",
        nota: m.nota||"", ordem: m.ordem, origemId: m.origem_id || null
      }))
    }))
  };
}

/* --------------------------- Progresso --------------------------- */
/* O Set continua sendo a única fonte que a tela lê. O que muda com a conta é
   de onde ele vem e para onde vai:
     deslogado → localStorage (só neste navegador)
     logado    → tabela progresso (acompanha você de aparelho em aparelho) */
function lerProgressoLocal(){
  try{ const a = JSON.parse(localStorage.getItem(PROG_KEY)||"[]"); return new Set(Array.isArray(a)?a:[]); }
  catch(e){ return new Set(); }
}
let progresso = lerProgressoLocal();

/* Quando cada item foi concluído (id → ISO). Companheiro do Set, NÃO substituto:
   o Set continua sendo a única fonte da verdade do ✓, e este Map é só enfeite
   informativo. Se ele estiver vazio ou incompleto, a tela ainda funciona.

   Só existe para quem está logado. O localStorage do visitante guarda apenas
   ids, sem data — e inventar uma seria mentir sobre quando você estudou. */
let progressoEm = new Map();

function salvarProgresso(){
  if(logado()) return;   // logado, a verdade mora no banco — não duplicar aqui
  try{ localStorage.setItem(PROG_KEY, JSON.stringify([...progresso])); }catch(e){}
}
function marcarItem(id, feito){
  if(feito){
    progresso.add(id);
    /* Data otimista, só se ainda não houver uma: o upsert do servidor manda
       apenas item_id e user_id, então o concluido_em original sobrevive a um
       segundo POST. Sobrescrever aqui faria a tela discordar do banco. */
    if(logado() && !progressoEm.has(id)) progressoEm.set(id, new Date().toISOString());
  } else {
    progresso.delete(id);
    progressoEm.delete(id);
  }
  salvarProgresso();
}
function aplicarProgresso(st){ st.abas.forEach(a=>a.itens.forEach(it=>{ it.feito = progresso.has(it.id); })); return st; }

async function carregarProgresso(){
  if(!logado()) return;
  /* concluido_em já era gravado desde a migração de contas (default now()) —
     esta é a primeira vez que alguém lê. Nenhum SQL novo foi preciso. */
  const linhas = await sbFetch("progresso?select=item_id,concluido_em");
  progresso   = new Set(linhas.map(l=>l.item_id));
  progressoEm = new Map(linhas.map(l=>[l.item_id, l.concluido_em]));
}

/* Manda ao banco em UMA requisição, não uma por item. O user_id vai explícito
   porque o upsert precisa da chave primária inteira para resolver conflito. */
async function sincProgresso(ids, feito){
  if(!logado() || !ids.length) return;
  /* Em blocos de 100: um DELETE com 300 uuids na querystring estouraria o
     limite de tamanho da URL. */
  const blocos = [];
  for(let i=0; i<ids.length; i+=100) blocos.push(ids.slice(i, i+100));
  await salvarNoServidor(async ()=>{
    for(const bloco of blocos){
      if(feito){
        await sbFetch("progresso", {
          method:"POST",
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(bloco.map(item_id=>({ item_id, user_id: sessao.user.id })))
        });
      } else {
        await sbFetch(`progresso?item_id=in.(${bloco.join(",")})`, {method:"DELETE"});
      }
    }
  });
}

/* Roda uma vez, no primeiro login: o progresso do localStorage está chaveado
   pelos uuids DO MODELO, e a sua cópia tem uuids novos. Sem isto, você entra
   e vê tudo desmarcado. Casa por TEXTO — mesmo truque do migrarProgressoAntigo. */
async function migrarProgressoParaConta(st){
  if(!logado() || localStorage.getItem(MIGR_CONTA_KEY)) return;
  try{
    const antigos = lerProgressoLocal();
    if(antigos.size){
      const modelo = await sbFetch("itens?user_id=is.null&select=id,texto");
      const feitos = new Set(modelo.filter(i=>antigos.has(i.id)).map(i=>i.texto));
      const novos = [];
      st.abas.forEach(a=>a.itens.forEach(it=>{
        if(feitos.has(it.texto) && !progresso.has(it.id)){ progresso.add(it.id); novos.push(it.id); }
      }));
      /* sbFetch direto, e não sincProgresso: aquele trata erro chamando
         recarregar(), que chamaria load() → esta função de novo, em laço. */
      if(novos.length){
        await sbFetch("progresso", {
          method:"POST",
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(novos.map(item_id=>({ item_id, user_id: sessao.user.id })))
        });
      }
    }
  }catch(e){ console.error("Migração do progresso:", e); return; }  // falhou: tenta de novo depois
  try{ localStorage.setItem(MIGR_CONTA_KEY, "1"); }catch(e){}
}

/* =====================================================================
   👉 RICARDO — escreva esta função (5 a 8 linhas).

   É ela que dá vida ao botão "✓ concluir tudo" / "↺ desmarcar tudo".
   Todo o resto já está pronto: o botão existe, o clique chega aqui, e
   depois que você mexer no Set eu re-sincronizo a tela sozinho.

   Parâmetros:
     aba    → { id, nome, itens:[ {id, texto, detalhe, feito} ] }
     marcar → true  = concluir tudo
              false = desmarcar tudo

   Ferramenta pronta:
     marcarItem(id, true|false)   → adiciona/remove do Set e já salva

   A decisão é sua, e ela tem consequência de verdade:

   1. "Desmarcar tudo" deve mesmo apagar TODO o progresso do tema? Se você
      concluiu 7 itens ao longo de 3 semanas e clica sem querer, perdeu.
      Uma alternativa é o botão só ADICIONAR (concluir os pendentes) e nunca
      remover — mais seguro, porém sem volta pelo mesmo caminho.

   2. Vale ignorar os itens que estão em edição (it.novo === true)? Eles
      ainda não existem no banco.
===================================================================== */
function marcarTodosDoTema(aba, marcar){
  aba.itens.forEach(it=>{
    if(it.novo) return;            // item em edição: ainda não existe no banco
    marcarItem(it.id, marcar);     // marcar=true conclui, false desmarca
  });
}

/* Roda uma vez: recupera o que você já tinha concluído no formato antigo.
   Casa por TEXTO, não por id — os ids do banco são uuids novos. */
function migrarProgressoAntigo(st){
  if(localStorage.getItem(MIGR_KEY)) return;
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY)||"null");
    if(d && Array.isArray(d.abas)){
      const feitos = new Set();
      d.abas.forEach(a=>a.itens.forEach(it=>{ if(it.feito) feitos.add(it.texto); }));
      st.abas.forEach(a=>a.itens.forEach(it=>{ if(feitos.has(it.texto)) progresso.add(it.id); }));
      salvarProgresso();
    }
  }catch(e){}
  try{ localStorage.setItem(MIGR_KEY,"1"); }catch(e){}
}

/* ------------------------ Datas e sequência ------------------------ */
const MES_CURTO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

/* "07/mar" — curto de propósito: cabe no selo ao lado do ✓ sem quebrar a linha. */
function diaCurto(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : `${String(d.getDate()).padStart(2,"0")}/${MES_CURTO[d.getMonth()]}`;
}

/* Identidade de um DIA, no fuso do aparelho.
   Isto não é preciosismo: concluido_em é timestamptz, guardado em UTC. Estudar
   às 21h em São Paulo é 00h do dia SEGUINTE em UTC. Contar por UTC partiria uma
   única noite de estudo em dois dias e inventaria uma sequência que não houve. */
function chaveDia(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* Dia → quantos itens você concluiu nele. O mapa de atividade usa a contagem
   para a intensidade; a sequência usa só as chaves. */
function diasDeEstudo(){
  const m = new Map();
  progressoEm.forEach(iso=>{
    const d = new Date(iso);
    if(isNaN(d)) return;
    const k = chaveDia(d);
    m.set(k, (m.get(k)||0) + 1);
  });
  return m;
}

/* =====================================================================
   Dias consecutivos com pelo menos uma conclusão — o número grande do
   card "Sequência".

     dias → Set de chaves "AAAA-MM-DD" com estudo (só os dias que houve)
     hoje → Date de agora, recebido de fora para poder ser testado

   Duas regras, e as duas foram escolhidas de propósito:

   1. HOJE AINDA CONTA. Não estudou hoje? A contagem começa por ontem em
      vez de zerar. O preço é um número "adiantado" — mostra 5 quando você
      cumpriu 4 — e ele se acerta sozinho: se o dia terminar sem estudo,
      amanhã a sequência cai de verdade.

   2. QUALQUER BURACO ROMPE, inclusive fim de semana. A alternativa
      (perdoar sábado e domingo) premiaria mais, mas viraria uma regra que
      ninguém consegue explicar nem conferir de cabeça — e um número em que
      você não confia não motiva.
===================================================================== */
function calcularSequencia(dias, hoje){
  const d = new Date(hoje); d.setHours(0,0,0,0);
  /* Tolerância do dia corrente: se você ainda não estudou HOJE, a contagem
     começa por ONTEM em vez de zerar. Às 9h da manhã a sequência não deveria
     estar morta — o dia ainda não acabou. Quem só estuda à noite seria punido
     por doze horas todo santo dia. */
  if(!dias.has(chaveDia(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(dias.has(chaveDia(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------------------- Novidades do modelo ---------------------- */
/* O trigger copia o modelo uma vez, no cadastro. Sem isto aqui, uma
   melhoria na trilha oficial nunca chegaria a quem já tem conta.

   Como sabemos o que é novo: cada linha copiada guarda de qual linha do
   modelo nasceu (origem_id). O que está no modelo e não é origem de nada
   seu — e que você ainda não dispensou — é novidade. */
async function carregarNovidades(st){
  novidades = null;
  if(!logado() || modoModelo || !temOrigem) return;   // sem a coluna, o recurso fica desligado
  try{
    const embedMat = temMateriais ? ",materiais(id,titulo,url,tipo,nota,ordem)" : "";
    const [modelo, dispensados] = await Promise.all([
      sbFetch(`temas?user_id=is.null&select=id,slug,nome,emoji,resumo,ordem,itens(id,texto,detalhe,ordem)${embedMat}&order=ordem`),
      sbFetch("modelo_dispensado?select=origem_id")
    ]);
    const fora = new Set((dispensados||[]).map(d=>d.origem_id));

    /* O que eu já tenho, indexado pela origem. */
    const meusTemas = new Map();
    const meusItens = new Set();
    const meusMats  = new Set();
    st.abas.forEach(a=>{
      if(a.origemId) meusTemas.set(a.origemId, a);
      a.itens.forEach(it=>{ if(it.origemId) meusItens.add(it.origemId); });
      (a.materiais||[]).forEach(m=>{ if(m.origemId) meusMats.add(m.origemId); });
    });

    /* O arquivado não está no `st` — o carregarTrilha() já o filtrou — e sem
       isto a origem dele sumiria do índice acima: a MESMA linha do modelo
       voltaria a ser oferecida como novidade, e aceitar criaria uma cópia do
       que você acabou de arquivar. Falha silenciosa, sem erro nenhum, então
       ela é paga aqui com duas consultas de uma coluna só. */
    const temasArquivados = new Set();
    if(temArquivo){
      const [ai, at] = await Promise.all([
        sbFetch(`itens?arquivado_em=not.is.null&user_id=eq.${sessao.user.id}&select=origem_id`),
        sbFetch(`temas?arquivado_em=not.is.null&user_id=eq.${sessao.user.id}&select=origem_id`)
      ]);
      (ai||[]).forEach(r=>{ if(r.origem_id) meusItens.add(r.origem_id); });
      (at||[]).forEach(r=>{ if(r.origem_id) temasArquivados.add(r.origem_id); });
    }

    const temas = [], itens = [], materiais = [];
    (modelo||[]).forEach(mt=>{
      /* Tema que VOCÊ arquivou: não reoferecer o tema nem os itens dele. */
      if(temasArquivados.has(mt.id)) return;
      const meu = meusTemas.get(mt.id);
      if(!meu){
        /* Tema inteiro novo. Não listamos os itens nem os materiais dele um
           a um: eles vêm junto quando você aceitar o tema. */
        if(!fora.has(mt.id)) temas.push(mt);
        return;
      }
      (mt.itens||[]).forEach(mi=>{
        if(!meusItens.has(mi.id) && !fora.has(mi.id)) itens.push({ item: mi, destino: meu, tema: mt });
      });
      (mt.materiais||[]).forEach(mm=>{
        if(!meusMats.has(mm.id) && !fora.has(mm.id)) materiais.push({ mat: mm, destino: meu, tema: mt });
      });
    });

    novidades = (temas.length || itens.length || materiais.length) ? { temas, itens, materiais } : null;
  }catch(e){
    /* Tabela ou coluna ausente, ou rede: o recurso some da tela sem
       atrapalhar o resto do app. */
    console.error("Novidades:", e);
    novidades = null;
  }
}

function contarNovidades(){
  if(!novidades) return 0;
  return novidades.temas.length + novidades.itens.length + (novidades.materiais||[]).length;
}

/* Traz para a sua trilha o que você marcou. Cada tema vira uma linha nova
   com origem_id preenchido — é isso que impede a mesma novidade de ser
   oferecida de novo no próximo F5. */
async function adicionarNovidades(temasSel, itensSel, matsSel){
  const usados = new Set(state.abas.map(a=>a.id));
  let ordem = state.abas.reduce((m,a)=>Math.max(m, a.ordem||0), 0);

  for(const mt of temasSel){
    const slug = slugUnico(mt.nome, null, usados);
    const temaId = novoId();
    await sbFetch("temas", {
      method:"POST", headers:{ "Prefer":"return=minimal" },
      body: JSON.stringify({ id: temaId, slug, nome:mt.nome, emoji:mt.emoji, resumo:mt.resumo||"", ordem: ++ordem, origem_id: mt.id })
    });
    const filhos = (mt.itens||[]).sort((a,b)=>a.ordem-b.ordem).map((i,k)=>({
      tema_id: temaId, texto:i.texto, detalhe:i.detalhe||"", ordem:k+1, origem_id:i.id
    }));
    if(filhos.length) await sbFetch("itens", {method:"POST", body: JSON.stringify(filhos)});

    /* Os materiais do tema vêm junto com ele — por isso não aparecem
       listados um a um quando o tema inteiro é novidade. */
    if(temMateriais){
      const mats = (mt.materiais||[]).sort((a,b)=>a.ordem-b.ordem).map((m,k)=>({
        tema_id: temaId, titulo:m.titulo, url:m.url||"", tipo:m.tipo||"outro",
        nota:m.nota||"", ordem:k+1, origem_id:m.id
      }));
      if(mats.length) await sbFetch("materiais", {method:"POST", body: JSON.stringify(mats)});
    }
  }

  /* Itens avulsos entram no fim do tema correspondente da SUA trilha. */
  const porTema = new Map();
  itensSel.forEach(n=>{
    if(!porTema.has(n.destino.dbId)) porTema.set(n.destino.dbId, { destino:n.destino, itens:[] });
    porTema.get(n.destino.dbId).itens.push(n.item);
  });
  for(const {destino, itens} of porTema.values()){
    let o = destino.itens.reduce((m,i)=>Math.max(m, i.ordem||0), 0);
    await sbFetch("itens", {method:"POST", body: JSON.stringify(itens.map(i=>({
      tema_id: destino.dbId, texto:i.texto, detalhe:i.detalhe||"", ordem: ++o, origem_id: i.id
    })))});
  }

  /* Materiais avulsos: mesma agregação por tema, para não mandar uma
     requisição por link. */
  const matsPorTema = new Map();
  (matsSel||[]).forEach(n=>{
    if(!matsPorTema.has(n.destino.dbId)) matsPorTema.set(n.destino.dbId, { destino:n.destino, mats:[] });
    matsPorTema.get(n.destino.dbId).mats.push(n.mat);
  });
  for(const {destino, mats} of matsPorTema.values()){
    let o = (destino.materiais||[]).reduce((m,x)=>Math.max(m, x.ordem||0), 0);
    await sbFetch("materiais", {method:"POST", body: JSON.stringify(mats.map(m=>({
      tema_id: destino.dbId, titulo:m.titulo, url:m.url||"", tipo:m.tipo||"outro",
      nota:m.nota||"", ordem: ++o, origem_id: m.id
    })))});
  }
}

/* Dispensar é o que impede um tema apagado de propósito de reaparecer
   para sempre. merge-duplicates porque dispensar duas vezes é inofensivo. */
async function dispensarNovidades(ids){

  await sbFetch("modelo_dispensado", {
    method:"POST",
    headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(ids.map(origem_id=>({ origem_id })))
  });
}

/* --------------------- Retrato local --------------------- */
/* Sem isto, abrir o app sem rede mostrava a SEED — a trilha embutida no
   arquivo, que não é a sua. Isso é pior que uma tela de erro: parece que
   os seus dados sumiram. O retrato guarda a última versão que veio do
   banco, chaveada por usuário (senão a trilha de uma conta apareceria na
   outra ao trocar de login). */
const RETRATO_KEY = "estudos-ia-retrato-v1";
function chaveRetrato(){ return `${RETRATO_KEY}:${(sessao && sessao.user && sessao.user.id) || "visitante"}`; }

function guardarRetrato(st){
  const alvo = st || state;
  if(!alvo || modoModelo) return;   // o modo modelo não é a trilha de ninguém
  try{
    localStorage.setItem(chaveRetrato(), JSON.stringify({
      quando: new Date().toISOString(),
      abas: alvo.abas,
      progresso: [...progresso],
      progressoEm: [...progressoEm]
    }));
  }catch(e){}   // cota estourada: seguir sem retrato é melhor que quebrar
}

function lerRetrato(){
  try{
    const d = JSON.parse(localStorage.getItem(chaveRetrato())||"null");
    return (d && Array.isArray(d.abas)) ? d : null;
  }catch(e){ return null; }
}

/* ---------------------------- Carga ---------------------------- */
const esperar = ms => new Promise(r=>setTimeout(r, ms));
let retratoDe = "";   // data do retrato que está na tela, para a faixa contar a verdade

async function load(){
  if(sbLigado()){
    /* Abrir o app instalado é justamente o instante em que o rádio do
       celular ainda está acordando: a primeira requisição falha por meio
       segundo de diferença. Desistir na primeira tentativa jogava o app
       inteiro em modo local pelo resto da sessão — era esta a causa de
       "perdeu a conexão com o banco". */
    for(let tentativa = 1; tentativa <= 3; tentativa++){
      try{
        await detectarColunas();
        await verificarAdmin();
        await detectarProjetos();
        if(!souAdmin) modoModelo = false;   // perdeu o crachá (ou trocou de conta): sai do modo
        const st = await carregarTrilha();
        offline = false; retratoDe = "";
        if(logado() && !modoModelo){
          await carregarProgresso();
          await migrarProgressoParaConta(st);
          await carregarNovidades(st);
          if(!iaDetectada){ iaDetectada = true; await detectarIA(); }
        } else if(logado()){
          /* Modo modelo: o progresso é de itens da SUA cópia, e aqui na tela
             estão os itens do modelo — ids diferentes. Não carregar nada é o
             certo: melhor nenhum ✓ do que ✓ no item errado. */
          progresso = new Set(); progressoEm = new Map(); novidades = null;
        } else {
          progresso = lerProgressoLocal();   // sair de uma conta não deixa o ✓ dela na tela
          progressoEm = new Map();           // nem as datas dela
          migrarProgressoAntigo(st);
        }
        const pronto = aplicarProgresso(st);
        guardarRetrato(pronto);
        return pronto;
      }catch(e){
        console.error(`Supabase indisponível (tentativa ${tentativa}/3):`, e);
        if(tentativa < 3) await esperar(500 * tentativa);
      }
    }
  }

  offline = true;   // sem chave, sem rede, ou banco fora do ar

  /* Ordem de preferência do que mostrar: o seu retrato > o backup antigo >
     a semente. A semente é o último recurso porque é a única que NÃO é sua. */
  const rt = lerRetrato();
  if(rt){
    progresso   = new Set(rt.progresso || []);
    progressoEm = new Map(rt.progressoEm || []);
    retratoDe   = rt.quando || "";
    return aplicarProgresso({ meta: clone(SEED.meta), abas: rt.abas });
  }
  retratoDe = "";
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY)||"null");
    if(d && Array.isArray(d.abas)) return aplicarProgresso(d);
  }catch(e){}
  return aplicarProgresso(clone(SEED));
}

/* Volta a rede? Sobe a fila e recarrega. Antes disto, o app ficava em modo
   local até alguém fechar e abrir de novo. */
let ultimaTentativa = 0;
async function tentarReconectar(){
  if(!sbLigado()) return;
  /* Sem freio, cada troca de aba dispararia três requisições e dois
     segundos de espera enquanto o celular estiver mesmo sem rede. */
  const agora = Date.now();
  if(agora - ultimaTentativa < 5000) return;
  ultimaTentativa = agora;

  const havia = pendentes();
  const subiu = await enviarFila();
  if(offline || subiu || havia) await recarregar();
}
window.addEventListener("online", tentarReconectar);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tentarReconectar(); });

/* --------------------------- Slugs --------------------------- */
/* O slug é a rota (#fundamentos-ia). Tira acento, espaço e maiúscula para o
   link continuar legível e não quebrar em nenhum navegador. */
function slugify(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "tema";
}
function slugUnico(nome, ignorarId, usados){
  const base = slugify(nome);
  const existe = s => (usados ? usados.has(s) : state.abas.some(a=>a.id===s && a.id!==ignorarId));
  let s = base, n = 2;
  while(existe(s)) s = `${base}-${n++}`;
  if(usados) usados.add(s);
  return s;
}

/* ------------------- Substituir a trilha inteira ------------------- */
/* Apaga tudo e reinsere a partir de um data.json. Os itens caem sozinhos
   pelo "on delete cascade" do supabase.sql. */
async function substituirTrilha(d){
  /* Filtro explícito pelo dono, e não "id=not.is.null" confiando no RLS:
     desde que existe admin, o RLS também autoriza apagar as linhas do
     modelo — um DELETE sem dono apagaria a trilha oficial de todo mundo
     junto com a sua. Dizer de quem é a linha custa nada e fecha a porta. */
  const dono = logado() ? `user_id=eq.${sessao.user.id}` : "user_id=is.null";
  await sbFetch(`temas?${dono}`, {method:"DELETE"});
  const usados = new Set();
  let ordem = 0;
  for(const a of d.abas){
    ordem++;
    const slug = slugUnico(a.id || a.nome, null, usados);
    const temaId = novoId();
    await sbFetch("temas", {
      method:"POST", headers:{ "Prefer":"return=minimal" },
      body: JSON.stringify({
        id: temaId,
        slug,
        nome:  (a.nome||"Sem nome").slice(0,60),
        emoji: (a.emoji||"📘").slice(0,8),
        resumo:(a.resumo||"").slice(0,200),
        ordem
      })
    });
    const itens = (a.itens||[]).map((it,k)=>({
      tema_id: temaId,
      texto:  (it.texto||"(sem título)").slice(0,200),
      detalhe:(it.detalhe||"").slice(0,300),
      ordem: k+1
    }));
    if(itens.length) await sbFetch("itens", {method:"POST", body: JSON.stringify(itens)});

    /* O Exportar já leva os materiais junto (eles moram no state). Sem
       recriá-los aqui, o Importar os perderia em silêncio — o pior tipo
       de perda, porque a tela fica plausível. */
    if(temMateriais){
      const mats = (a.materiais||[]).map((m,k)=>({
        tema_id: temaId,
        titulo: (m.titulo||"(sem título)").slice(0,120),
        url:    (m.url||"").slice(0,500),
        tipo:   TIPOS_MAT[m.tipo] ? m.tipo : "outro",
        nota:   (m.nota||"").slice(0,500),
        ordem: k+1
      }));
      if(mats.length) await sbFetch("materiais", {method:"POST", body: JSON.stringify(mats)});
    }
  }
}

/* ⚠ A URL vem digitada pelo usuário, e vai virar href.
   "javascript:alert(1)" num href é XSS — o esc() cuida das aspas do
   atributo, mas não do ESQUEMA. Só http e https viram link; qualquer
   outra coisa é devolvida como texto puro e a tela mostra sem link. */
function urlSegura(u){
  try{
    const p = new URL(String(u||"").trim());
    return (p.protocol === "http:" || p.protocol === "https:") ? p.href : "";
  }catch(e){ return ""; }
}

/* "youtube.com" em vez da URL inteira: diz a procedência sem estourar a
   largura da linha no celular. */

}

async function carregarMensagens(){

/* Redesenhar por cima de quem está escrevendo apagaria o texto dele. Esta
   guarda vale para o poll e para o tempo real — os dois podem chegar no
   pior momento possível. */
function digitandoNoMural(){
  const inp = document.querySelector("[data-form-msg] input[name='texto']");
  return Boolean(inp && (inp.value.trim() || document.activeElement===inp));
}

/* Poll: deixou de ser o mecanismo principal e virou rede de segurança, por
   isso o intervalo folgado. WebSocket cai em rede móvel e ninguém avisa;
   o poll cobre o buraco sem que se perceba. */
async function atualizarMural(){
  if(route()!=="mural" || offline || digitandoNoMural()) return;
  const antes = mensagens.length ? mensagens[0].id : null;
  await carregarMensagens();
  if((mensagens.length ? mensagens[0].id : null) !== antes) render();
}

/* Tempo real. O SDK já está carregado por causa do login, então o custo
   aqui é quase zero — foi o que mudou a decisão de não usá-lo no mural.
   Se a tabela não estiver na publication supabase_realtime, o canal
   simplesmente nunca recebe evento e o poll continua fazendo o trabalho. */
function ligarRealtimeMural(){
  if(!sbClient || muralCanal || offline) return;
  try{
    muralCanal = sbClient
      .channel("mural")
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"mensagens" }, payload=>{
        const m = payload && payload.new;
        if(!m || !m.id) return;
        if(mensagens.some(x=>x.id===m.id)) return;   // o meu próprio envio já entrou na lista
        mensagens.unshift(m);
        if(route()==="mural" && !digitandoNoMural()) render();
      })
      .subscribe();
  }catch(e){ console.error("Realtime:", e); muralCanal = null; }
}

function desligarRealtimeMural(){
  if(!muralCanal) return;
  try{ sbClient.removeChannel(muralCanal); }catch(e){}
  muralCanal = null;
}

/* Uma função só para os dois: entrar no #mural liga tempo real + poll,
   sair desliga os dois. Assim não existe estado meio ligado. */
function ajustarMural(){
  if(muralTimer){ clearInterval(muralTimer); muralTimer=null; }
  if(route()==="mural" && !offline){
    ligarRealtimeMural();
    muralTimer = setInterval(atualizarMural, 60000);
  } else {
    desligarRealtimeMural();
  }
}
window.addEventListener("focus", atualizarMural);
