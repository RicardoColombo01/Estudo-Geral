<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha de Estudos — IA & Dev</title>
<style>
/* ============ Tokens ============ */
:root{
  --font-display: Georgia, "Times New Roman", serif;
  --font-body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;

  --bg:#0E1518; --bg-2:#0B1113;
  --panel:#152025; --panel-2:#1A272D;
  --line:#26383F; --line-soft:#1E2E34;
  --ink:#EAF1F2; --ink-dim:#B7C6CB; --muted:#7E949C;
  --accent:#FF8A5B; --accent-ink:#1a0f0a;
  --done:#57D2B0; --done-ink:#06231d;
  --gold:#F2C14E;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --radius:14px;
}
:root[data-theme="light"]{
  --bg:#EDF2F1; --bg-2:#E4ECEA;
  --panel:#FFFFFF; --panel-2:#F5F8F7;
  --line:#D6E1DE; --line-soft:#E5EDEB;
  --ink:#12242A; --ink-dim:#33474E; --muted:#5D7178;
  --accent:#DF5F31; --accent-ink:#fff;
  --done:#12977A; --done-ink:#fff;
  --gold:#B9852A;
  --shadow: 0 10px 30px rgba(20,40,45,.10);
}

*{box-sizing:border-box}
html,body{margin:0; overflow-x:hidden}
body{
  min-height:100vh;
  background:
    radial-gradient(1100px 520px at 50% -8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}

/* ============ Container central ============ */
.wrap{max-width:860px; margin:0 auto; padding:22px 22px 80px; width:100%}

/* top bar (todas as telas) */
.bar{display:flex; align-items:center; gap:12px; margin-bottom:22px}
.bar .spacer{flex:1}
.brandmini{font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.ghost{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  background:var(--panel); color:var(--ink-dim); border:1px solid var(--line);
  padding:8px 13px; border-radius:10px; font-size:13px; transition:.15s}
.ghost:hover{color:var(--ink); border-color:var(--accent)}
.ghost.back{font-weight:600; color:var(--ink)}

/* ============ Home ============ */
.home-head{text-align:center; margin:14px 0 26px}
.home-head .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent)}
.home-head h1{font-family:var(--font-display); font-weight:600; font-size:38px; line-height:1.08; letter-spacing:-.02em; margin:12px 0 8px}
.home-head p{margin:0 auto; color:var(--muted); max-width:52ch}

.overall-card{display:flex; align-items:center; gap:20px; justify-content:center;
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:20px 24px; box-shadow:var(--shadow); margin-bottom:26px; flex-wrap:wrap}
.big-ring{--v:0; width:90px; height:90px; border-radius:50%; flex:none;
  background:conic-gradient(var(--accent) calc(var(--v)*1%), var(--line) 0); display:grid; place-items:center; transition:background .6s}
.big-ring > span{width:70px; height:70px; border-radius:50%; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center}
.big-ring b{font-family:var(--font-mono); font-size:20px; line-height:1}
.big-ring small{color:var(--muted); font-size:9px; letter-spacing:.14em; text-transform:uppercase; margin-top:2px}
.overall-txt{min-width:180px}
.overall-txt h3{margin:0 0 4px; font-family:var(--font-display); font-weight:600; font-size:18px}
.overall-txt p{margin:0 0 10px; color:var(--muted); font-size:13px}
.overall-txt .track{height:8px; border-radius:99px; background:var(--line); overflow:hidden; max-width:320px}
.overall-txt .track > i{display:block; height:100%; background:var(--accent); transition:width .6s cubic-bezier(.2,.7,.2,1)}

.section-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:26px 4px 10px}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(232px,1fr)); gap:12px}
.card{display:flex; flex-direction:column; text-align:left; cursor:pointer; gap:0;
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 16px 15px;
  transition:transform .14s, border-color .14s, background .14s; min-height:96px}
.card:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
.card.feature{background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, var(--panel)), var(--panel))}
.card.done-all{border-color:color-mix(in srgb, var(--done) 45%, var(--line))}
.card .c-top{display:flex; align-items:center; gap:9px; margin-bottom:auto}
.card .c-num{font-family:var(--font-mono); font-size:12px; color:var(--muted)}
.card.done-all .c-num{color:var(--done)}
.card .c-emoji{font-size:20px}
.card .c-name{font-weight:600; font-size:15px; margin:10px 0 3px; line-height:1.2}
.card .c-sub{color:var(--muted); font-size:12.5px; margin:0}
.card .c-bar{height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:12px}
.card .c-bar > i{display:block; height:100%; background:var(--accent); transition:width .5s}
.card.done-all .c-bar > i{background:var(--done)}
.card .c-meta{display:flex; justify-content:space-between; align-items:center; margin-top:8px}
.card .c-count{font-family:var(--font-mono); font-size:11px; color:var(--muted)}
.card .c-go{font-size:16px; color:var(--accent); opacity:0; transition:.14s}
.card:hover .c-go{opacity:1}
.badge{font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent-ink);
  background:var(--accent); border-radius:99px; padding:2px 9px}

/* ============ Section header ============ */
.sec-head{margin-bottom:20px}
.sec-head .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent)}
.sec-head h2{font-family:var(--font-display); font-weight:600; font-size:30px; letter-spacing:-.02em; margin:8px 0 6px; overflow-wrap:break-word}
.sec-head p{margin:0; color:var(--muted); max-width:62ch}
.sec-head .prog-inline{display:flex; align-items:center; gap:12px; margin-top:14px}
.sec-head .track{flex:1; max-width:340px; height:8px; border-radius:99px; background:var(--line); overflow:hidden}
.sec-head .track > i{display:block; height:100%; background:var(--accent); width:0; transition:width .5s cubic-bezier(.2,.7,.2,1)}
.sec-head.all-done .track > i{background:var(--done)}
.sec-head .pct{font-family:var(--font-mono); font-size:13px; color:var(--ink-dim)}

/* ============ Items ============ */
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.item{display:grid; grid-template-columns:26px 1fr auto; align-items:start; gap:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px; transition:border-color .15s, background .15s}
.item:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.item.is-done{background:var(--panel-2); border-color:var(--line-soft)}
.check{margin-top:1px; width:24px; height:24px; border-radius:7px; cursor:pointer;
  border:2px solid var(--muted); background:transparent; color:transparent;
  display:grid; place-items:center; font-size:14px; transition:.15s; padding:0}
.check:hover{border-color:var(--accent)}
.item.is-done .check{background:var(--done); border-color:var(--done); color:var(--done-ink)}
.item-body{min-width:0}
.item-text{margin:0; font-size:15px; font-weight:600; color:var(--ink); overflow-wrap:break-word}
.item.is-done .item-text{text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--done) 70%, transparent); color:var(--ink-dim)}
.item-detail{margin:4px 0 0; font-size:12.5px; color:var(--muted); overflow-wrap:break-word}
.pill-done{display:inline-flex; align-items:center; gap:5px; margin-top:8px;
  font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:lowercase;
  color:var(--done); background:color-mix(in srgb,var(--done) 15%, transparent);
  border:1px solid color-mix(in srgb,var(--done) 40%, transparent); border-radius:99px; padding:3px 9px}
.chip{display:inline-flex; align-items:center; gap:5px; margin-top:8px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.03em;
  color:var(--ink-dim); background:var(--panel-2);
  border:1px solid var(--line); border-radius:99px; padding:3px 10px}
.item-actions{display:flex; gap:4px}
.mini{background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer;
  border-radius:8px; padding:5px 8px; font-size:12px; transition:.15s; white-space:nowrap}
.mini:hover{color:var(--ink); background:var(--panel-2); border-color:var(--line)}
.mini.danger:hover{color:#ff7a7a; border-color:color-mix(in srgb,#ff7a7a 40%,var(--line))}

.edit-form{grid-column:1 / -1; display:flex; flex-direction:column; gap:8px}
.edit-form input{font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%}
.edit-form input:focus{outline:none; border-color:var(--accent)}
.edit-form input.detail{font-size:12.5px; color:var(--ink-dim)}
.edit-form .row{display:flex; gap:8px; justify-content:flex-end}
.btn{cursor:pointer; border-radius:9px; padding:8px 14px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-dim)}
.btn:hover{color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.add-item{margin-top:12px; width:100%; border:1.5px dashed var(--line); background:transparent; color:var(--muted);
  border-radius:12px; padding:12px; cursor:pointer; font-size:13px; font-weight:600; transition:.15s}
.add-item:hover{border-color:var(--accent); color:var(--ink)}

/* ============ Resumo ============ */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.rcard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px}
.rcard h4{margin:0 0 14px; font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent)}
.rcard.wide{grid-column:1 / -1}
.tprog{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
.tprog:last-child{border-bottom:0}
.tprog .tp-emoji{font-size:16px; width:22px; text-align:center}
.tprog .tp-name{flex:1; font-size:13.5px; font-weight:600; cursor:pointer; overflow-wrap:break-word}
.tprog .tp-name:hover{color:var(--accent)}
.tprog .tp-bar{width:96px; height:6px; border-radius:99px; background:var(--line); overflow:hidden; flex:none}
.tprog .tp-bar > i{display:block; height:100%; background:var(--accent); width:0; transition:width .5s}
.tprog.full .tp-bar > i{background:var(--done)}
.tprog .tp-num{font-family:var(--font-mono); font-size:11px; color:var(--muted); width:38px; text-align:right; flex:none}
.pend{list-style:none; margin:0; padding:0}
.pend li{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px}
.pend li:last-child{border-bottom:0}
.pend .p-tag{font-family:var(--font-mono); font-size:10px; color:var(--accent); white-space:nowrap}
.cron{width:100%; border-collapse:collapse; font-size:13px}
.cron th,.cron td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft)}
.cron th{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.cron td.wk{font-family:var(--font-mono); color:var(--accent); white-space:nowrap}

.foot{margin-top:26px; color:var(--muted); font-size:12px; text-align:center}
.foot code{font-family:var(--font-mono); background:var(--panel); padding:2px 6px; border-radius:6px; border:1px solid var(--line)}
.empty-state{text-align:center; padding:40px 20px; color:var(--muted)}
.empty-state .big{font-size:40px; margin-bottom:10px}

/* ============ Gestão de temas ============ */
.tema-actions{display:flex; gap:4px; margin-top:14px; flex-wrap:wrap}
.mini[disabled]{opacity:.3; cursor:default}
.mini[disabled]:hover{color:var(--muted); background:transparent; border-color:transparent}
.row-tema{display:flex; gap:8px}
.row-tema input[name="emoji"]{width:64px; text-align:center; font-size:18px; flex:none}
.card.novo{border-style:dashed; align-items:center; justify-content:center; text-align:center}
.card.novo .c-name{margin-top:0}

/* ============ Mural ============ */
.msg-form{margin-bottom:22px}
.msgs{gap:8px}
.msg{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; list-style:none}
.msg-head{display:flex; align-items:baseline; gap:10px; margin-bottom:5px}
.msg-head b{font-size:13.5px; color:var(--accent)}
.msg-head time{font-family:var(--font-mono); font-size:10.5px; color:var(--muted)}
.msg-body{margin:0; font-size:14px; color:var(--ink); overflow-wrap:break-word; white-space:pre-wrap}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

@media (max-width:640px){
  .wrap{padding:16px 15px 60px}
  .home-head h1{font-size:30px}
  .grid-2{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

/* --------------------------- Rede --------------------------- */
/* Porta única de saída: todo acesso ao banco passa por aqui, então os headers
   de autenticação ficam num lugar só. */
async function sbFetch(path, opts={}){
  const r = await fetch(`${SB.url}/rest/v1/${path}`, {
    ...opts,
    headers:{
      "apikey": SB.key,
      "Authorization": `Bearer ${SB.key}`,
      "Content-Type": "application/json",
      ...(opts.headers||{})
    }
  });
  if(!r.ok) throw new Error(`${r.status} — ${await r.text()}`);
  return r.status===204 ? null : r.json();
}

/* Envia uma escrita ao servidor. Se falhar, avisa e recarrega do banco para a
   tela não ficar mostrando uma mentira otimista. */
async function salvarNoServidor(op){
  if(offline){ persist(); return true; }

let progresso = (()=>{
  try{ const a = JSON.parse(localStorage.getItem(PROG_KEY)||"[]"); return new Set(Array.isArray(a)?a:[]); }
  catch(e){ return new Set(); }
})();

function salvarProgresso(){ try{ localStorage.setItem(PROG_KEY, JSON.stringify([...progresso])); }catch(e){} }
function marcarItem(id, feito){ feito ? progresso.add(id) : progresso.delete(id); salvarProgresso(); }
function aplicarProgresso(st){ st.abas.forEach(a=>a.itens.forEach(it=>{ it.feito = progresso.has(it.id); })); return st; }

/* =====================================================================
   👉 RICARDO — escreva esta função (5 a 8 linhas).

   É ela que dá vida ao botão "✓ concluir tudo" / "↺ desmarcar tudo".
   Todo o resto já está pronto: o botão existe, o clique chega aqui, e
   depois que você mexer no Set eu re-sincronizo a tela sozinho.

   Parâmetros:
     aba    → { id, nome, itens:[ {id, texto, detalhe, feito} ] }
     marcar → true  = concluir tudo
              false = desmarcar tudo

   Ferramenta pronta:
     marcarItem(id, true|false)   → adiciona/remove do Set e já salva

   A decisão é sua, e ela tem consequência de verdade:

   1. "Desmarcar tudo" deve mesmo apagar TODO o progresso do tema? Se você
      concluiu 7 itens ao longo de 3 semanas e clica sem querer, perdeu.
      Uma alternativa é o botão só ADICIONAR (concluir os pendentes) e nunca
      remover — mais seguro, porém sem volta pelo mesmo caminho.

   2. Vale ignorar os itens que estão em edição (it.novo === true)? Eles
      ainda não existem no banco.
===================================================================== */
function marcarTodosDoTema(aba, marcar){
  aba.itens.forEach(it=>{
    if(it.novo) return;            // item em edição: ainda não existe no banco
    marcarItem(it.id, marcar);     // marcar=true conclui, false desmarca
  });
}

/* Roda uma vez: recupera o que você já tinha concluído no formato antigo.
   Casa por TEXTO, não por id — os ids do banco são uuids novos. */
function migrarProgressoAntigo(st){
  if(localStorage.getItem(MIGR_KEY)) return;
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY)||"null");
    if(d && Array.isArray(d.abas)){
      const feitos = new Set();
      d.abas.forEach(a=>a.itens.forEach(it=>{ if(it.feito) feitos.add(it.texto); }));
      st.abas.forEach(a=>a.itens.forEach(it=>{ if(feitos.has(it.texto)) progresso.add(it.id); }));
      salvarProgresso();
    }
  }catch(e){}
  try{ localStorage.setItem(MIGR_KEY,"1"); }catch(e){}
}

/* --------------------------- Slugs --------------------------- */
/* O slug é a rota (#fundamentos-ia). Tira acento, espaço e maiúscula para o
   link continuar legível e não quebrar em nenhum navegador. */
function slugify(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "tema";
}
function slugUnico(nome, ignorarId, usados){
  const base = slugify(nome);
  const existe = s => (usados ? usados.has(s) : state.abas.some(a=>a.id===s && a.id!==ignorarId));
  let s = base, n = 2;
  while(existe(s)) s = `${base}-${n++}`;
  if(usados) usados.add(s);
  return s;
}

/* ------------------- Substituir a trilha inteira ------------------- */
/* Apaga tudo e reinsere a partir de um data.json. Os itens caem sozinhos
   pelo "on delete cascade" do supabase.sql. */
async function substituirTrilha(d){
  await sbFetch("temas?id=not.is.null", {method:"DELETE"});
  const usados = new Set();
  let ordem = 0;
  for(const a of d.abas){
    ordem++;
    const slug = slugUnico(a.id || a.nome, null, usados);
    const [row] = await sbFetch("temas", {
      method:"POST", headers:{ "Prefer":"return=representation" },
      body: JSON.stringify({
        slug,
        nome:  (a.nome||"Sem nome").slice(0,60),
        emoji: (a.emoji||"📘").slice(0,8),
        resumo:(a.resumo||"").slice(0,200),
        ordem
      })
    });
    const itens = (a.itens||[]).map((it,k)=>({
      tema_id: row.id,
      texto:  (it.texto||"(sem título)").slice(0,200),
      detalhe:(it.detalhe||"").slice(0,300),
      ordem: k+1
    }));
    if(itens.length) await sbFetch("itens", {method:"POST", body: JSON.stringify(itens)});
  }
}

    ? `<ul class="pend">${pend.slice(0,7).map(p=>`<li><span class="p-tag">${esc(p.tag)}</span><span>${esc(p.texto)}</span></li>`).join("")}
        ${pend.length>7?`<li><span class="p-tag">+${pend.length-7}</span><span>itens pendentes…</span></li>`:""}</ul>`
    : `<div class="empty-state"><div class="big">🎉</div><p>Tudo concluído. Parabéns!</p></div>`;

  let crono = CRONO.map(r=>`<tr><td class="wk">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("");

  return `<div class="wrap">
    ${topBar()}
    <div class="sec-head">
      <div class="eyebrow">visão geral</div>
      <h2>📊 Seu progresso</h2>
      <p>Um painel da sua trilha. Marque itens como <b>pronto</b> nos estágios e acompanhe tudo aqui.</p>
    </div>
    <div class="overall-card" style="margin-bottom:22px">
      <div class="big-ring" style="--v:${ov.pct}"><span><b class="mono">${ov.pct}%</b><small>concluído</small></span></div>
      <div class="overall-txt">
        <h3>${ov.d} de ${ov.t} itens</h3>
        <p>${ov.t-ov.d} pendentes • ${state.abas.length} estágios</p>
        <div class="track"><i style="width:${ov.pct}%"></i></div>
      </div>
    </div>
    <div class="grid-2">
      <div class="rcard"><h4>Progresso por estágio</h4>${bars}</div>
      <div class="rcard"><h4>Próximos passos</h4>${pendHtml}</div>
      <div class="rcard wide"><h4>Cronograma — ~10 semanas (≈1h/dia)</h4>
        <table class="cron"><thead><tr><th>Período</th><th>Foco</th></tr></thead><tbody>${crono}</tbody></table></div>
    </div>
  </div>`;
}

/* ============================ Render ============================ */
function viewMural(){
  const apelido = identidadeAutor();
  const n = mensagens.length;

  const lista = n
    ? `<ul class="list msgs">${mensagens.map(m=>`<li class="msg">
        <div class="msg-head"><b>${esc(m.autor)}</b><time>${quando(m.criada_em)}</time></div>
        <p class="msg-body">${esc(m.texto)}</p>
      </li>`).join("")}</ul>`
    : `<div class="empty-state"><div class="big">💬</div>
        <p class="item-text" style="color:var(--ink)">Nenhum recado ainda</p>
        <p>Escreva o primeiro — ele fica visível para todo mundo que abrir esta página.</p></div>`;

  const form = offline
    ? `<p class="foot" style="text-align:left">O mural precisa do banco. Em modo local não dá para ler nem enviar.</p>`
    : `<form class="edit-form msg-form" data-form-msg="1">
        <input name="autor" value="${esc(apelido)}" placeholder="Seu apelido" maxlength="40" autocomplete="off" required>
        <input name="texto" placeholder="Escreva um recado…" maxlength="500" autocomplete="off" required>
        <div class="row"><button type="submit" class="btn primary">Enviar</button></div>
      </form>`;

  return `<div class="wrap">
    ${topBar()}
    <div class="sec-head">
      <div class="eyebrow">mural — ${n} recado${n===1?"":"s"}</div>
      <h2>💬 Mural de recados</h2>
      <p>Compartilhado com todos que acessam a página. Fica salvo no banco: não some no F5, nem ao fechar o navegador. Recado enviado não pode ser editado nem apagado.</p>
    </div>
    ${form}
    ${lista}
  </div>`;
}

function avisoOffline(){
  if(!offline) return "";
  const motivo = sbLigado() ? "o banco não respondeu" : "a anon key ainda não foi preenchida no topo do arquivo";
  return `<div class="wrap" style="padding-top:0">
    <p class="foot">⚠ <b>Modo local</b> — ${motivo}. Suas mudanças ficam só neste navegador.</p></div>`;
}

function render(){
  if(carregando){
    $("#app").innerHTML = `<div class="wrap"><div class="empty-state">
      <div class="big">⏳</div><p>Carregando a trilha…</p></div></div>`;
    return;
  }
  const r = route();
  let html;
  if(r==="home") html = viewHome();
  else if(r==="afazer") html = viewAfazer();
  else if(r==="resumo") html = viewResumo();
  else if(r==="mural") html = viewMural();
  else { const idx = state.abas.findIndex(a=>a.id===r); if(idx<0){ location.hash=""; return; } html = viewStage(idx); }
  $("#app").innerHTML = html + avisoOffline();
}

/* ============================ Ações ============================ */
document.addEventListener("click", async e=>{
  /* data-action é consultado antes de data-go: assim um botão de ação dentro
     de um card navegável vence a navegação do card que o contém. */
  const act = e.target.closest("[data-action]");
  if(!act){
    const goEl = e.target.closest("[data-go]");
    if(goEl) go(goEl.dataset.go);
    return;
  }
  const action = act.dataset.action;
  const li = act.closest(".item"); const id = li?.dataset.id;

  switch(action){
    case "voltar": if(history.length>1){ history.back(); } else { go("home"); } break;
    case "theme": toggleTheme(); break;
    case "export": exportJSON(); break;
    case "import": $("#fileIn").click(); break;

    case "restore":
      /* A trilha agora é compartilhada — zerar o conteúdo apagaria o de todos.
         Este botão passa a zerar só o SEU progresso. Trocar a trilha inteira
         vem na Etapa 4 (Importar). */
      if(confirm("Zerar o seu progresso? Os temas compartilhados não são afetados.")){
        progresso.clear(); salvarProgresso(); aplicarProgresso(state); editingId=null; render();
      } break;

    case "toggle":{
      const f=findItem(id); if(!f) break;
      f.it.feito = !f.it.feito; marcarItem(id, f.it.feito); render();
      break;
    }

    case "toggle-all":{
      const marcar = act.dataset.marcar === "1";
      const alvo = route()==="afazer"
        ? state.abas
        : [state.abas.find(a=>a.id===route())].filter(Boolean);
      alvo.forEach(aba => marcarTodosDoTema(aba, marcar));
      aplicarProgresso(state);   // re-sincroniza os ✓ a partir do Set
      render();
      break;
    }

    /* ---------------------- Gestão de temas ---------------------- */
    case "tema-edit": editingAba = route(); editingId = null; render(); focusTema(); break;

    case "tema-cancel":{
      const aba = state.abas.find(a=>a.id===editingAba);
      editingAba = null;
      if(aba && aba.novo){ state.abas = state.abas.filter(a=>a!==aba); go("home"); }
      else render();
      break;
    }

    case "tema-novo":{
      /* Igual ao item novo: nasce só na memória e só vira linha no banco
         quando você salvar — assim cancelar não deixa lixo para os outros. */
      const tmp = "novo-"+uid();
      const ordem = state.abas.reduce((m,a)=>Math.max(m, a.ordem||0), 0) + 1;
      state.abas.push({ id:tmp, dbId:null, nome:"", emoji:"📘", resumo:"", ordem, itens:[], novo:true });
      editingAba = tmp; editingId = null;
      go(tmp); focusTema();
      break;
    }

    case "tema-delete":{
      const aba = state.abas.find(a=>a.id===route()); if(!aba) break;
      if(!confirm(`Excluir o tema "${aba.nome}" e seus ${aba.itens.length} itens?\n\nIsso apaga para TODOS que acessam a página.`)) break;
      const dbId = aba.dbId;
      aba.itens.forEach(it=>progresso.delete(it.id)); salvarProgresso();
      state.abas = state.abas.filter(a=>a!==aba);
      go("home");
      if(dbId) await salvarNoServidor(()=> sbFetch(`temas?id=eq.${dbId}`, {method:"DELETE"}));
      break;
    }

    case "tema-up":
    case "tema-down":{
      const i = state.abas.findIndex(a=>a.id===route()); if(i<0) break;
      const j = action==="tema-up" ? i-1 : i+1;
      if(j<0 || j>=state.abas.length) break;
      [state.abas[i], state.abas[j]] = [state.abas[j], state.abas[i]];
      /* Renumera pela posição: conserta sozinho qualquer ordem duplicada. */
      const mudados = [];
      state.abas.forEach((a,k)=>{ if(a.ordem!==k+1){ a.ordem=k+1; mudados.push(a); } });
      render();
      await salvarNoServidor(async ()=>{
        for(const a of mudados){
          if(a.dbId) await sbFetch(`temas?id=eq.${a.dbId}`, {method:"PATCH", body: JSON.stringify({ordem:a.ordem})});
        }
      });
      break;
    }

    case "edit": editingId=id; render(); focusEdit(); break;

    case "cancel":{
      const f=findItem(editingId);
      if(f && (f.it.novo || !f.it.texto)){ f.aba.itens=f.aba.itens.filter(i=>i.id!==editingId); }
      editingId=null; render(); break;
    }

    case "delete":{
      const f=findItem(id); if(!f || !confirm("Excluir este item?")) break;
      f.aba.itens = f.aba.itens.filter(i=>i.id!==id);
      progresso.delete(id); salvarProgresso();
      render();
      await salvarNoServidor(()=> sbFetch(`itens?id=eq.${id}`, {method:"DELETE"}));
      break;
    }

    case "add":{
      /* Item novo nasce só na memória: o banco exige texto não-vazio, então ele
         só é criado de verdade quando você salvar o formulário. */
      const aba=state.abas.find(a=>a.id===route()); if(!aba) break;
      const nid=uid();
      const proxOrdem = aba.itens.reduce((m,i)=>Math.max(m, i.ordem||0), 0) + 1;
      aba.itens.push({id:nid, texto:"", detalhe:"", feito:false, novo:true, ordem:proxOrdem});
      editingId=nid; render(); focusEdit(); break;
    }
  }
});

document.addEventListener("submit", async e=>{
  /* ------------------------- Tema ------------------------- */
  const ft = e.target.closest("[data-form-tema]");
  if(ft){
    e.preventDefault();
    const aba = state.abas.find(a=>a.id===ft.dataset.formTema); if(!aba) return;
    const nome   = (ft.nome.value.trim() || "Sem nome").slice(0,60);
    const emoji  = (ft.emoji.value.trim() || "📘").slice(0,8);
    const resumo = ft.resumo.value.trim().slice(0,200);
    const eraNovo = Boolean(aba.novo);

    aba.nome = nome; aba.emoji = emoji; aba.resumo = resumo;
    editingAba = null;

    if(eraNovo){
      /* Troca o id temporário pelo slug definitivo ANTES de navegar, senão a
         rota aponta para um tema que não existe mais e o app cai na home. */
      const slug = slugUnico(nome, aba.id);
      delete aba.novo; aba.id = slug;
      go(slug);
      await salvarNoServidor(async ()=>{
        const [row] = await sbFetch("temas", {
          method:"POST", headers:{ "Prefer":"return=representation" },
          body: JSON.stringify({ slug, nome, emoji, resumo, ordem: aba.ordem })
        });
        aba.dbId = row.id;
      });
    } else {
      render();
      await salvarNoServidor(()=> sbFetch(`temas?id=eq.${aba.dbId}`, {
        method:"PATCH", body: JSON.stringify({ nome, emoji, resumo })
      }));
    }
    return;
  }

  /* ------------------------- Mural ------------------------- */
  const fm = e.target.closest("[data-form-msg]");
  if(fm){
    e.preventDefault();
    if(offline){ alert("O mural precisa do banco. Em modo local não dá para enviar."); return; }
    const autor = (fm.autor.value.trim() || "Anônimo").slice(0,40);
    const texto = fm.texto.value.trim().slice(0,500);
    if(!texto) return;
    salvarApelido(autor);
    fm.texto.value = "";
    try{
      const [row] = await sbFetch("mensagens", {
        method:"POST", headers:{ "Prefer":"return=representation" },
        body: JSON.stringify({ autor, texto })
      });
      mensagens.unshift(row);
      render();
    }catch(err){
      console.error(err);
      alert("Não consegui enviar o recado.\n\n"+err.message);
    }
    return;
  }

  /* ------------------------- Item ------------------------- */
  const form = e.target.closest("[data-form]"); if(!form) return;
  e.preventDefault();
  const f = findItem(form.dataset.form);
  if(!f){ editingId=null; render(); return; }

  /* Corta nos limites do check constraint do banco (200 / 300). */
  const texto   = (form.texto.value.trim() || "(sem título)").slice(0,200);
  const detalhe = form.detalhe.value.trim().slice(0,300);
  const eraNovo = Boolean(f.it.novo);

  f.it.texto = texto; f.it.detalhe = detalhe; delete f.it.novo;
  editingId = null; render();

  await salvarNoServidor(async ()=>{
    if(eraNovo){
      const [row] = await sbFetch("itens", {
        method:"POST",
        headers:{ "Prefer":"return=representation" },
        body: JSON.stringify({ tema_id:f.aba.dbId, texto, detalhe, ordem:f.it.ordem })
      });
      f.it.id = row.id;   // troca o id temporário pelo uuid que o banco gerou
      render();
    } else {
      await sbFetch(`itens?id=eq.${f.it.id}`, {
        method:"PATCH", body: JSON.stringify({ texto, detalhe })
      });
    }
  });
});

function focusEdit(){ requestAnimationFrame(()=>{ const i=document.querySelector(".edit-form input[name='texto']"); if(i){ i.focus(); i.select(); } }); }
function focusTema(){ requestAnimationFrame(()=>{ const i=document.querySelector("[data-form-tema] input[name='nome']"); if(i){ i.focus(); i.select(); } }); }

function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="data.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}
$("#fileIn").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let d;
    try{ d = JSON.parse(r.result); if(!d || !Array.isArray(d.abas)) throw new Error("formato"); }
    catch(err){
      alert("Arquivo inválido. Selecione um data.json exportado por este app.");
      e.target.value=""; return;
    }

    if(offline){   // sem banco, importar é o comportamento antigo: só local
      state = aplicarProgresso(d); editingId=null; editingAba=null; persist(); render();
      e.target.value=""; return;
    }

    const nItens = d.abas.reduce((n,a)=>n+((a.itens&&a.itens.length)||0), 0);
    const ok = confirm(
      `Substituir a trilha inteira por ${d.abas.length} temas e ${nItens} itens?\n\n`+
      `Isso APAGA a trilha atual para TODOS que acessam a página.\n`+
      `Se quiser poder voltar atrás, cancele e clique em Exportar antes.`
    );
    if(!ok){ e.target.value=""; return; }

    try{
      carregando = true; render();
      await substituirTrilha(d);
      state = await load();
    }catch(err){
      console.error(err);
      alert("Falha ao substituir a trilha.\n\n"+err.message);
      state = await load();
    }
    carregando = false; editingId=null; editingAba=null; render();
    e.target.value="";
  };
  r.readAsText(file);
});

function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); }
function toggleTheme(){ const next = curTheme()==="dark"?"light":"dark"; try{ localStorage.setItem(THEME_KEY, next); }catch(e){} applyTheme(next); render(); }

/* ============================ Init ============================ */
applyTheme((()=>{ try{ return localStorage.getItem(THEME_KEY)||"dark"; }catch(e){ return "dark"; } })());
render();   // pinta o "carregando" antes do primeiro fetch

(async ()=>{
  state = await load();
  carregando = false;
  if(route()==="mural") await carregarMensagens();
  render();
  ajustarPollMural();
})();
</script>
